  security: {stage: PROTOTYPE_PLUS, can: [READ_BUILD, SECURITY_VETO]}
  customer-validation: {stage: VALIDATION, can: [READ_CONTACTS, DRAFT_OUTREACH, RECORD_INTERACTION], cannot: [SEND_OUTREACH_WITHOUT_AUTH]}
  prospecting: {stage: VALIDATION, can: [READ_RESEARCH, WRITE_CONTACTS, DRAFT_OUTREACH]}
