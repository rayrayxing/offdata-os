  venture-historian: {stage: PORTFOLIO, can: [READ_ALL, WRITE_LEARNING], cannot: [CHANGE_POLICY_DIRECTLY]}
  capability-architect: {stage: PRE_CONTRARIAN_1, can: [READ_RESEARCH, PROPOSE_SKILLS, CREATE_KANBAN]}
  skill-engineer: {stage: PRE_CONTRARIAN_1, can: [BUILD_SKILL_CANDIDATE], cannot: [CERTIFY_OWN_SKILL]}
  skill-auditor: {stage: PRE_CONTRARIAN_1, can: [READ_SKILLS, PROPOSE_SKILL_CERTIFICATION], cannot: [WRITE_GATE_POLICY]}
  frontier-scout: {stage: DISCOVERY, can: [READ_RESEARCH, WRITE_RESEARCH, CREATE_SIGNAL]}
  trend-spotter: {stage: DISCOVERY, can: [READ_RESEARCH, WRITE_RESEARCH, CREATE_SIGNAL]}
  technology-transfer: {stage: DISCOVERY, can: [READ_RESEARCH, PROPOSE_THESIS]}
  context-translator: {stage: DISCOVERY, can: [READ_RESEARCH, PROPOSE_THESIS]}
  venture-imagination: {stage: DISCOVERY, can: [PROPOSE_THESIS], cannot: [DECLARE_VIABILITY]}
  entrepreneur-in-residence: {stage: DISCOVERY, can: [READ_RESEARCH, PROPOSE_THESIS, CREATE_KANBAN]}
  deep-research-lead: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH, CREATE_KANBAN]}
  technology-researcher: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH]}
  industry-researcher: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH]}
  customer-anthropologist: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH, PROPOSE_CLAIMS]}
  competitive-intelligence: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH, PROPOSE_CONCERNS]}
  regulatory-researcher: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH, PROPOSE_CONCERNS]}
