  legal-compliance: {stage: MULTI, can: [READ_ALL_VENTURE, PROPOSE_CONCERNS, LEGAL_VETO]}
  wind-down-operator: {stage: WIND_DOWN, can: [CREATE_KANBAN, EXECUTE_WINDDOWN_WITH_AUTH], cannot: [IGNORE_CUSTOMER_OBLIGATIONS]}
