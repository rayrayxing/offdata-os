  distribution-researcher: {stage: RESEARCH, can: [READ_RESEARCH, WRITE_RESEARCH, PROPOSE_DISTRIBUTION]}
  opportunity-architect: {stage: RESEARCH, can: [READ_RESEARCH, PROPOSE_CONCEPT]}
  contrarian: {stage: MULTI, can: [READ_ALL_VENTURE, PROPOSE_CONCERNS, PROPOSE_KILL, PROPOSE_REFINEMENT], cannot: [KILL_WITHOUT_POLICY_DECISION]}
  venture-refiner: {stage: PRE_PROTOTYPE, can: [READ_ALL_VENTURE, PROPOSE_CONCEPT]}
  business-model-architect: {stage: PRE_PROTOTYPE, can: [PROPOSE_BUSINESS_MODEL]}
  distribution-architect: {stage: PRE_PROTOTYPE, can: [PROPOSE_DISTRIBUTION]}
  experiment-designer: {stage: PRE_PROTOTYPE, can: [PROPOSE_EXPERIMENT]}
