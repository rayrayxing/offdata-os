  - credential_payment_oauth_or_external_approval_required
  - unresolved_legal_privacy_security_or_copyright_concern
  - test_and_expected_result_conflict
  - suspected_incorrect_golden_fixture
  - data_loss_or_corruption_risk
  - material_architecture_change
  - phase_boundary_would_be_crossed
activation_conditions:
