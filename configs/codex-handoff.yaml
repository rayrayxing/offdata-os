task_graph:
  - id: P0.1
    title: Repository baseline
    dependencies: []
    deliverables:
      - reconcile_monorepo_structure_without_replacing_governed_assets
      - preserve_governing_documentation_and_code_ownership
      - add_licence_decision_placeholder
      - retain_secret_safe_ignore_and_environment_examples
    acceptance:
      - canonical_read_order_remains_clear
      - no_secret_is_committed
      - existing_chat_first_assets_are_integrated_not_duplicated
  - id: P0.2
    title: Local development environment
    dependencies:
      - P0.1
    deliverables:
      - nextjs_application_shell
      - fastapi_service_shell
      - local_postgresql
      - local_s3_compatible_object_storage
      - container_orchestration
      - one_command_start_stop_and_health_checks
    acceptance:
      - clean_macos_setup_can_start_all_services
      - health_checks_pass
      - no_paid_cloud_resource_is_required
  - id: P0.3
    title: Engineering quality baseline
    dependencies:
      - P0.1
      - P0.2
    deliverables:
      - formatting_linting_and_type_checks
      - unit_test_runners
      - secret_and_dependency_scanning
      - github_actions_ci
      - local_precommit_or_equivalent
    acceptance:
      - deliberate_failure_blocks_ci
      - safe_change_passes_all_checks
      - existing_phase_1_to_7_and_pcr_01_to_08_gate_remains_green
  - id: P0.4
    title: Security and operating documentation
    dependencies:
      - P0.1
    deliverables:
      - threat_model_skeleton_reconciled_with_existing_catalogue
      - secret_handling_guide
      - environment_separation_plan
      - founder_action_register
      - architecture_decision_template
      - build_status_ledger
      - initial_operating_controls_integrated
    acceptance:
      - no_real_client_data_enabled
      - no_processor_or_external_action_is_approved
      - rollback_and_founder_actions_are_documented
