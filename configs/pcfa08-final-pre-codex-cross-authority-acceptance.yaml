cross_authority_invariants:
- id: XAUTH-01
  statement: Historical WS/PCR package readiness is retained evidence and never drives
    current launch readiness.
- id: XAUTH-02
  statement: repository/current-operational-state.json is the sole live machine readiness
    projection.
- id: XAUTH-03
  statement: The WS6 permanent release parent and record commit are historical ancestors,
    not current launch-SHA equality targets.
- id: XAUTH-04
  statement: Current repository posture requires private/internal development with
    no public licence grant.
- id: XAUTH-05
  statement: PCFA-04 product scope remains planned_not_implemented until its bound
    IMP tasks execute.
- id: XAUTH-06
  statement: PCFA-05 MVCL remains planned_not_implemented and Founder interrupt controls
    remain mandatory.
- id: XAUTH-07
  statement: PCFA-06 Hermes capabilities remain bounded, suggestion-only where specified,
    and not activated.
- id: XAUTH-08
  statement: PCFA-07 covers exactly 93 obligations with 93 planned tests and zero
    IMP-P0 widening.
- id: XAUTH-09
  statement: The Codex launch target is exactly P0.1-P0.4 on codex/phase-0-foundation
    with a draft PR.
- id: XAUTH-10
  statement: No implementation may begin before a valid local single-use permit binds
    the exact approved current main SHA.
- id: XAUTH-11
  statement: 'Live Issue #1 and Issue #19 bodies must match current repository bodies
    at permit time.'
- id: XAUTH-12
  statement: Repository visibility, hosted controls, branch cleanup and clean macOS
    evidence are manual launch gates.
- id: XAUTH-13
  statement: Historical branch cleanup is exact-name only and every deleted ref requires
    its final SHA to be retained.
- id: XAUTH-14
  statement: The live GitHub branch inventory must contain only main immediately before
    Codex branch creation.
- id: XAUTH-15
  statement: Founder authorization binds one exact current main SHA and exactly P0.1-P0.4;
    merge and P1 remain unauthorized.
- id: XAUTH-16
  statement: The Codex branch and any Codex Phase 0 PR must be absent before permit
    issuance.
- id: XAUTH-17
  statement: Synthetic data only, no runtime/Hermes activation, no real client data,
    no paid services, no OAuth, no external actions and no production.
- id: XAUTH-18
  statement: Any current-authority or launch-evidence drift invalidates prior launch
    evidence and requires re-acceptance.
