operating_principles:
  - id: HERMES-BOUND-01
    statement: offdata owns the consulting control plane, lifecycle, policy decisions and canonical engagement state; Hermes remains a replaceable runtime or worker candidate.
  - id: HERMES-BOUND-02
    statement: Hermes session, goal, memory, skill, journey, background-task and subagent state are never canonical engagement truth.
  - id: HERMES-BOUND-03
    statement: No raw Hermes surface may widen tools, data access, providers, credentials, external effects or approval scope beyond an offdata-issued package.
  - id: HERMES-BOUND-04
    statement: Completion is determined by offdata acceptance evidence and tests, never solely by a Hermes judge, subagent summary or self-assessment.
  - id: HERMES-BOUND-05
    statement: Hermes-created or Hermes-discovered skills remain candidates until independently reviewed, tested, provenance-checked and explicitly promoted through offdata governance.
  - id: HERMES-BOUND-06
    statement: Background, nested or parallel execution is disabled unless a later implementation phase proves durability, isolation, idempotency, cost and policy conformance.
  - id: HERMES-BOUND-07
    statement: Model fan-out and Mixture-of-Agents are advisory computation patterns behind the offdata model router and cannot themselves satisfy independent-quality requirements.
  - id: HERMES-BOUND-08
    statement: Persistent memory and learning surfaces may suggest useful context or reusable procedures but cannot write client truth, methodology authority or approvals.
  - id: HERMES-BOUND-09
    statement: External skill registries, MCP servers, tool gateways, messaging channels, scheduled jobs and provider integrations require separate allowlisting and applicable Founder approvals before use.
  - id: HERMES-BOUND-10
    statement: Hermes adoption must remain removable without loss of canonical state, audit history, evidence, workflow checkpoints or deliverable provenance.

upstream_evidence:
  - evidence_id: HERMES-EVID-RELEASE
    source_kind: stable_release
    url: https://github.com/NousResearch/hermes-agent/releases/tag/v2026.7.7.2
    observed: Hermes Agent v0.18.2 remains the latest stable release, tagged v2026.7.7.2 at commit 9de9c25.
  - evidence_id: HERMES-EVID-GOAL
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/goals
    observed: Persistent /goal loops auto-continue across turns and may use completion contracts with outcome, verification, constraints, boundaries and stop_when fields.
  - evidence_id: HERMES-EVID-DELEGATION
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/delegation
    observed: delegate_task creates isolated subagents; top-level delegation runs in the background, default parallelism is three, and execution is not crash-durable while children are still running.
  - evidence_id: HERMES-EVID-SKILLS
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
    observed: Skills support progressive disclosure, external directories, hub registries, bundles, agent-managed writes and optional write approval.
  - evidence_id: HERMES-EVID-LEARN
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/reference/slash-commands
    observed: /learn can distill reusable skills from described sources and workflows; /journey exposes a learned-skill and memory timeline with edit and delete surfaces.
  - evidence_id: HERMES-EVID-MEMORY
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/memory
    observed: Hermes persistent memory is injected across sessions and may be modified by the agent.
  - evidence_id: HERMES-EVID-CURATOR
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/curator
    observed: The curator performs background maintenance and may archive or patch agent-created skills after inactivity.
  - evidence_id: HERMES-EVID-MOA
    source_kind: current_documentation
    url: https://hermes-agent.nousresearch.com/docs/user-guide/features/mixture-of-agents
    observed: Mixture-of-Agents is a model-provider surface that fans out reference-model calls and uses an aggregator as the acting tool-capable model.

