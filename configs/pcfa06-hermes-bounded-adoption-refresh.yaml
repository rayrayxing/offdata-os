    integration_points: [P1.1, P1.4, P4.1, P4.2, P10.3, P10.4]
    required_controls: [repository_canonical_skills, read_only_external_directory, checksum_and_provenance, independent_review, explicit_promotion]
    denied_raw_actions: [hub_install_without_review, automatic_update, canonical_write, direct_external_send]
  - capability_id: HERMES-CAP-LEARN
