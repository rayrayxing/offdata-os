requirements:
  - id: PS-MANDATE-001
    statement: Convert notes, transcripts, documents and CRM context into a governed mandate packet containing decision statement, owner/date, problem, scope, constraints, options, facts, assumptions, interpretations, gaps, evidence standard, hypotheses, methods, data requests and engagement plan, escalating only material gaps to the Founder.
    acceptance: Mandate packet fields are traceable to source or labelled assumption and do not create a second engagement state.
    status: planned_not_implemented
  - id: PS-ENGAGEMENT-001
    statement: Provide one Engagement Workspace with Overview, Mandate, Decisions, Hypotheses, Evidence, Methods, Analysis, Recommendations, Story, Deliverables, Implementation, Benefits, Quality and Audit surfaces as views over canonical state.
    acceptance: No workspace surface owns duplicate canonical state.
    status: planned_not_implemented
  - id: PS-QA-001
    statement: Provide a Quality and Assurance Console showing defect, severity, materiality, affected record, creator, independent reviewer, rubric/test, block status, repair, disposition, waiver, rerun evidence and release impact.
    acceptance: Material blocking defects cannot be hidden by presentation state or waived without governed disposition.
    status: planned_not_implemented
  - id: PS-IMPLEMENTATION-001
    statement: Trace recommendation to initiative, milestone, dependency, owner, delivery, adoption, outcome, benefit and verification while distinguishing work completed, adoption, outcome and realised benefit.
    acceptance: Benefits cannot exist without an approved recommendation and baseline linkage.
    status: planned_not_implemented
  - id: PS-INGEST-001
    statement: Support governed ingestion for Markdown/TXT, DOCX, digital PDF, PPTX, XLSX, CSV and HTML/web snapshots first, with scanned images/OCR, email packages, transcripts/audio-video derivatives and archives treated as later adapters.
    acceptance: Original bytes/checksum are preserved and unsupported or malformed sources are quarantined rather than silently normalised.
    status: planned_not_implemented
  - id: PS-LOCATOR-001
    statement: Preserve native provenance locators for PDF page/region, DOCX section/paragraph/table, PPTX slide/shape, XLSX sheet/cell/range/formula, HTML URL/snapshot/DOM-text locator and transcript speaker/timestamp.
    acceptance: Material claims can resolve to source-native locations after ingestion and re-ingestion.
    status: planned_not_implemented
  - id: PS-LIBRARY-001
    statement: Replace count-only library readiness with 100 percent accounting of approved canonical library sources as structured records, ingested unstructured sources, duplicates, superseded items, quarantined items or explicit exclusions with reason.
    acceptance: No approved canonical source is silently unaccounted for.
    status: planned_not_implemented
  - id: CQ-DECISION
    statement: Outputs remain explicitly relevant to the governing decision and decision owner.
    acceptance: Material sections can state which decision they inform.
    status: planned_not_implemented
  - id: CQ-ANSWER
    statement: Executive and section outputs are answer-first rather than chronology-first.
    acceptance: Governing answer appears before supporting detail where the format permits.
    status: planned_not_implemented
  - id: CQ-TITLE
    statement: Titles are assertion-led where a conclusion is supported rather than generic topic labels.
    acceptance: Assertion titles reconcile with supporting content and evidence.
    status: planned_not_implemented
  - id: CQ-STORY
    statement: Storyline progresses coherently from question through evidence, implications, options and recommendation.
    acceptance: Independent review finds no material narrative jump or unsupported conclusion.
    status: planned_not_implemented
  - id: CQ-MECE
    statement: Decompositions are mutually exclusive and collectively sufficient where MECE structure is appropriate, with exceptions made explicit.
    acceptance: Overlap and omission checks are documented for material decompositions.
    status: planned_not_implemented
  - id: CQ-ALT
    statement: Material recommendations show credible alternatives and trade-offs.
    acceptance: At least one meaningful rejected alternative is retained for material decisions unless explicitly inapplicable.
    status: planned_not_implemented
  - id: CQ-UNCERT
    statement: Confidence and uncertainty are calibrated to evidence strength and model sensitivity.
    acceptance: No unsupported precision or certainty is presented as fact.
    status: planned_not_implemented
  - id: CQ-DENSITY
    statement: Information density is sufficient for professional consulting use without unnecessary clutter.
    acceptance: Reviewer rubric flags neither material under-explanation nor avoidable overload.
    status: planned_not_implemented
  - id: CQ-VISUAL
    statement: Visual archetypes fit the analytical message rather than decorating it.
    acceptance: Major visuals have an explicit message-to-archetype rationale.
    status: planned_not_implemented
  - id: CQ-HIER
    statement: Visual hierarchy, whitespace and emphasis support rapid executive scanning.
    acceptance: Primary message, evidence and caveats are visually distinguishable.
    status: planned_not_implemented
  - id: CQ-REDUND
    statement: Redundant statements and repeated evidence are controlled across sections and deliverable variants.
    acceptance: Repetition is intentional and audience-appropriate when retained.
    status: planned_not_implemented
  - id: CQ-ACTION
    statement: Recommendations identify concrete actions, owners, timing and success conditions at a level appropriate to the engagement.
    acceptance: Material recommendations can transition into implementation records without semantic reinvention.
    status: planned_not_implemented
  - id: CQ-RISK
    statement: Material recommendations disclose risks, dependencies, reversibility and key failure modes.
    acceptance: Decision packets retain material downside and dependency information.
    status: planned_not_implemented
  - id: CQ-AUDIENCE
    statement: Language, depth, terminology and evidence density fit the intended audience while preserving canonical meaning.
    acceptance: Audience adaptation does not change approved claims, numbers or recommendation meaning.
    status: planned_not_implemented
  - id: CQ-EXEC
    statement: Executive summaries are standalone decision-useful artefacts.
    acceptance: Executive summary states decision context, answer, rationale, value, risks and next actions without requiring the full deliverable.
    status: planned_not_implemented
  - id: PS-GOLDEN-001
    statement: Maintain representative golden-output programmes across strategy, growth/pricing, cost/value, CX, operating model, organisation/workforce, AI/digital, risk/control, M&A, carve-out, valuation/capital, implementation and benefits using invariants/ranges rather than exact prose.
    acceptance: Golden evaluation covers all engagement families without freezing wording.
    status: planned_not_implemented
  - id: PS-ROUNDTRIP-001
    statement: Support canonical-to-Office render, human external edit, re-import, semantic/numeric/layout diff, classification, Founder adopt/reject and regeneration without overwriting human edits.
    acceptance: Wording, title, number, formula, chart, layout, recommendation, assumption, citation and structure changes are classified and reviewable.
    status: planned_not_implemented
  - id: PS-STYLE-001
    statement: Maintain a versioned canonical Founder/house-style profile for writing, titles, slide density, number formats, chart/table preferences, terminology, risk phrasing, citations, templates/brand, fonts, executive-summary form and decision-packet density.
    acceptance: Style preferences remain separate from agent memory and can be versioned, audited and overridden per engagement.
    status: planned_not_implemented
  - id: PS-ASSET-RIGHTS-001
    statement: Track provenance, owner, licence, permitted use, client-provided status, alteration/distribution rights, attribution and expiry for fonts, photos, icons, logos, templates, third-party charts/data and maps.
    acceptance: External release is blocked for material assets with unknown or incompatible rights.
    status: planned_not_implemented
  - id: PS-FOUNDER-ATTENTION-001
    statement: Measure material interruptions per engagement, Founder review minutes, false escalations, recycled decisions, stale-approval invalidation, output acceptance/edit level and material recommendation overrides.
    acceptance: Workload reduction is assessed with Founder attention burden, not only compute/runtime metrics.
    status: planned_not_implemented
  - id: PS-DELIVERABLE-VARIANTS-001
    statement: Produce board deck, working-team deck, decision memo, detailed report, workbook, implementation plan and one-page executive summary from the same approved semantic story and number sources.
    acceptance: Variants reconcile material claims, recommendations and numbers to one canonical approved state.
    status: planned_not_implemented
  - id: PS-REVIEW-001
    statement: Support draft, review, anchored comment, resolve/reject, reissue and version history with reviewer, affected semantic object, disposition and audit trail.
    acceptance: Review comments and dispositions remain anchored across versions and cannot silently mutate approved canonical content.
    status: planned_not_implemented

phase_ownership_summary:
  IMP-P0: No new product-runtime scope; only foundation must preserve extension points and fail-closed boundaries.
  IMP-P1: Broader source matrix, native provenance locators, canonical-library accounting and asset-rights provenance foundation.
  IMP-P2: Mandate workbench shell, Engagement Workspace, QA Console shell, Implementation/Benefits records, house-style profile and review records.
  IMP-P3: Review/recycle workflow, implementation/benefit lifecycle and governed interaction states.
  IMP-P4: Mandate/context enhancement and Consulting Craft evaluation harnesses.
  IMP-P5: Source-locator evidence adapters, mandate research support and evidence traceability.
  IMP-P6: Existing quantitative reproducibility remains the numeric foundation consumed by new workspaces and QA.
  IMP-P7: Consulting Craft quality, output variants, golden outputs, style application, rights checks and Office round-trip reconciliation.
  IMP-P8: No new standalone surface; CRM conversion must populate the same mandate and engagement model.
  IMP-P9: No new standalone state; origination must feed the same CRM/opportunity/mandate path.
  IMP-P10: No new standalone method state; Radar feeds the governed source/method registry without auto-promotion.
  IMP-P11: Mature QA/security release controls and material asset-rights enforcement.
  IMP-P12: Founder-attention metrics, golden/CQ/round-trip/variant/library completeness acceptance and cross-engagement validation.

pcfa07_reconciliation_contract:
  every_requirement_must_receive_exact_task_binding: true
  every_requirement_must_receive_planned_test_id: true
  every_requirement_must_receive_evidence_type: true
  every_requirement_must_receive_blocking_phase_gate: true
  every_requirement_must_receive_dependency_mapping: true
  status_must_remain_planned_not_implemented_until_codex_evidence: true

