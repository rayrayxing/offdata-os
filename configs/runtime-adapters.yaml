  - public
  - internal
  real_client_data_enabled: false
  unregistered_processor_default: deny
  provider_training_allowed: false
  credential_values_permitted: false
  cross_tenant_execution_permitted: false
observability:
  required_events:
  - runtime.invocation.accepted
  - runtime.invocation.started
  - runtime.invocation.completed
  - runtime.invocation.failed
  - runtime.invocation.blocked
  - runtime.invocation.cancelled
  - runtime.invocation.timed_out
  - runtime.budget.exceeded
  - runtime.policy.denied
  - runtime.kill_switch.triggered
  raw_secret_logging_permitted: false
