schema_version: 1
phase_id: PCR-05
contract_id: OFFDATA-RUNTIME-ADAPTERS-2026-08-05
repository: rayrayxing/offdata-os
canonical_branch: main
authority:
  controlling_instruction: AGENTS.md
  control_plane_owner: offdata
  provider_independent: true
  canonical_write_mode: commands_only
  runtime_memory_is_canonical: false
  founder_accountability_preserved: true
protocol:
  protocol_version: offdata.runtime-adapter.v1
  serialization: json
  correlation_required: true
  idempotency_required_for_mutating_or_external_operations: true
  contract_version_required: true
canonical_contracts:
  offdata_bundle: schemas/offdata-contract-bundle.schema.json
  runtime_contracts: schemas/runtime-adapter-contracts.schema.json
adapter_kinds:
- adapter_kind: agent_runtime
  purpose: Bounded typed agent execution.
  operations:
  - invoke
  - cancel
  - health
  request_definition: AgentRuntimeRequest
  response_definition: AgentRuntimeResponse
  required_capabilities:
  - typed_input
  - typed_output
  - budgets
  - tool_scope
  forbidden_capabilities:
  - direct_write
  - self_approval
  - unbounded_tools
  canonical_write_mode: commands_only
  external_action_mode: deny_by_default
  kill_switch_required: true
  health_check_required: true
- adapter_kind: workflow_runtime
  purpose: Durable lifecycle coordination.
  operations:
  - start
  - signal
  - query
  - cancel
  - health
  request_definition: WorkflowRuntimeRequest
  response_definition: WorkflowRuntimeResponse
  required_capabilities:
  - durable_id
  - checkpointing
  - replay
  - approval_wait
  forbidden_capabilities:
  - direct_domain_mutation
  - approval_fabrication
  - silent_retry
  canonical_write_mode: commands_only
  external_action_mode: deny_by_default
  kill_switch_required: true
  health_check_required: true
- adapter_kind: worker_harness
  purpose: Isolated bounded work packages.
  operations:
  - execute
  - cancel
  - health
  request_definition: WorkerPackage
  response_definition: WorkerResult
  required_capabilities:
  - isolation
  - tool_scope
  - tests
  - artifacts
  forbidden_capabilities:
  - direct_write
  - unbounded_access
  - secrets
  canonical_write_mode: commands_only
  external_action_mode: deny_by_default
  kill_switch_required: true
  health_check_required: true
- adapter_kind: tool_runtime
  purpose: Policy-checked tool invocation.
  operations:
  - invoke
  - cancel
  - health
  request_definition: ToolInvocation
  response_definition: ToolResult
  required_capabilities:
  - class_scope
  - params
  - idempotency
  - approval
  forbidden_capabilities:
  - undeclared_tool
  - unapproved_side_effect
  - secret_echo
  canonical_write_mode: commands_only
  external_action_mode: deny_by_default
  kill_switch_required: true
  health_check_required: true
