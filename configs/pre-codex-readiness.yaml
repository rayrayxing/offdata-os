schema_version: 1.0.0
contract_id: OFFDATA-PRE-CODEX-READINESS-2026-08-06
phase_id: PCR-10
title: Pre-Codex release consolidation and quality acceptance
repository: rayrayxing/offdata-os
canonical_branch: main
status: chat_first_complete_not_integrated
authority:
  controlling_instruction: AGENTS.md
  execution_handoff: handoff/codex-phase0-handoff.json
  prior_issue_contract: contracts/codex-phase0-issue.json
  pre_codex_readiness_contract: contracts/pre-codex-readiness.json
  final_issue_body: handoff/codex-phase0-issue-pcr10.md
  final_pre_start_gate_owner: PCR-10
  founder_explicit_approval_required_to_start: true
  issue_is_execution_summary_not_authority: true
activation_conditions:
- pcr03_merged_to_main
- pcr04_merged_to_main
- pcr05_merged_to_main
- pcr06_merged_to_main
- pcr07_merged_to_main
- pcr08_merged_to_main
- pcr09_merged_to_main
- pcr10_merged_to_main
- github_hosted_controls_in_issue_19_verified
- explicit_founder_phase_0_approval_received
- clean_macos_environment_available
prior_phase_records:
- phase: PCR-08
  path: contracts/initial-operating-controls.json
- phase: PCR-09
  path: contracts/codex-phase0-issue.json
- phase: PCR-04
  path: handoff/codex-phase0-handoff.json
release_integrity:
  canonical_release_requirements:
  - one_authoritative_main_sha
  - one_pre_codex_release_id
  - pcr03_through_pcr10_merge_commits_recorded
  - generated_record_digests_recorded
  - test_registry_digest_recorded
  - latest_successful_complete_workflow_recorded
  - unresolved_defects_and_waivers_recorded
  - permanent_evidence_not_only_expiring_artifacts
  - rollback_instructions_recorded
  integration_state: pending_governed_merge_sequence
  critical_or_high_defects_allowed: 0
  generated_tree_must_be_clean: true
  clean_clone_validation_required: true
developer_experience:
  phase0_required_commands:
  - doctor
  - bootstrap
  - up
  - down
  - restart
  - health
  - test
  - lint
  - format
  - scan
  - reset-synthetic
  - backup
  - restore
  - clean
  - support-bundle
  acceptance_criteria:
  - id: DX-ROOT
    criterion: All routine commands execute from the repository root.
    evidence_class: phase0_acceptance
  - id: DX-DIAG
    criterion: Failures explain cause, affected component and safe remediation.
    evidence_class: phase0_acceptance
  - id: DX-PORTS
    criterion: Port conflicts and unsupported versions are detected before startup.
    evidence_class: phase0_acceptance
  - id: DX-PATH
    criterion: Cleanup and reset operations are path-safe and synthetic-data scoped.
    evidence_class: phase0_acceptance
  - id: DX-SECRETS
    criterion: No credential or secret value appears in command output or support bundles.
    evidence_class: phase0_acceptance
  - id: DX-BACKUP
    criterion: Backup and restore are demonstrable with deterministic synthetic state.
    evidence_class: phase0_acceptance
  - id: DX-MAC
    criterion: The supported macOS and Apple Silicon environment is documented and checked.
    evidence_class: phase0_acceptance
founder_experience:
  acceptance_criteria:
  - id: FX-INBOX
    criterion: Founder can identify every pending material decision in under one minute.
    evidence_class: later_implementation_acceptance
  - id: FX-CONSEQUENCE
    criterion: Every decision shows consequence, deadline and reversibility.
    evidence_class: later_implementation_acceptance
  - id: FX-AUTH
    criterion: Recommendation and authorization are visually and semantically distinct.
    evidence_class: later_implementation_acceptance
  - id: FX-PREVIEW
    criterion: Every approval previews the exact next action before execution.
    evidence_class: later_implementation_acceptance
  - id: FX-EVIDENCE
    criterion: Material claims and numbers drill through to evidence and model outputs.
    evidence_class: later_implementation_acceptance
  - id: FX-STATES
    criterion: Waiting, blocked, retrying, failed, stale and complete states are distinct.
    evidence_class: later_implementation_acceptance
  - id: FX-ACCESS
    criterion: Keyboard navigation, visible focus, contrast and readable errors pass accessibility checks.
    evidence_class: later_implementation_acceptance
  - id: FX-SEND
    criterion: Client or prospect sending is impossible from an unauthorized state.
    evidence_class: later_implementation_acceptance
output_quality:
  evidence:
  - id: OQ-CITE
    metric: material_citation_resolution_percent
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  - id: OQ-CLAIM
    metric: unsupported_material_claims
    target: 0
    unit: count
    evidence_class: later_implementation_acceptance
  - id: OQ-LABEL
    metric: fact_assumption_synthesis_recommendation_labels
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  - id: OQ-CONTRA
    metric: contradicting_evidence_retained
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  quantitative:
  - id: OQ-NUM
    metric: material_number_reconciliation_percent
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  - id: OQ-HARD
    metric: unexplained_hardcoded_material_numbers
    target: 0
    unit: count
    evidence_class: later_implementation_acceptance
  - id: OQ-RECALC
    metric: independent_recalculation_pass_percent
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  - id: OQ-XFMT
    metric: cross_format_material_number_agreement_percent
    target: 100
    unit: percent
    evidence_class: later_implementation_acceptance
  artifact_surfaces:
    pptx:
    - opens_without_repair_warning
    - editable_shapes_and_charts
    - no_clipping_overlap_or_off_slide_content
    - readable_typography
    - template_and_brand_compliance
    - citations_and_notes_preserved
    - visual_regression_passed
    docx:
    - opens_without_repair_warning
    - correct_heading_navigation
    - controlled_pagination
    - no_orphaned_headings_or_broken_tables
    - accessible_structure_and_alt_text
    - citation_consistency
    xlsx:
    - formulas_remain_formulas
    - formula_and_reference_validation
    - input_assumption_output_separation
    - independent_recalculation
    - print_areas_and_named_ranges
    - reconciles_to_approved_deliverables
    pdf_svg_html:
    - correct_rendering
    - selectable_text_where_appropriate
    - accessibility
    - responsive_html
    - print_safe_views
    - no_missing_fonts_or_assets
    - material_consistency_with_office_outputs
operational_quality:
  acceptance_criteria:
  - id: OP-CORR
    criterion: Structured correlation IDs connect workflow, agent, tool and artifact events.
    evidence_class: phase0_acceptance
  - id: OP-ERROR
    criterion: Errors are classified as retryable, terminal, authorization, validation or dependency failures.
    evidence_class: phase0_acceptance
  - id: OP-TRACE
    criterion: Tracing is OpenTelemetry-compatible and privacy-safe by default.
    evidence_class: phase0_acceptance
  - id: OP-HEALTH
    criterion: Health, readiness and liveness semantics are distinct and tested.
    evidence_class: phase0_acceptance
  - id: OP-COST
    criterion: Cost, usage and latency records are attributable to model, tool and workflow.
    evidence_class: later_implementation_acceptance
  - id: OP-FLAGS
    criterion: Feature flags and kill switches are visible, fail-closed and auditable.
    evidence_class: later_implementation_acceptance
  - id: OP-SBOM
    criterion: Dependency provenance, license results and an SBOM are retained per release.
    evidence_class: phase0_acceptance
  - id: OP-RECOVERY
    criterion: Backup, restore, rollback and support-bundle drills are executable and documented.
    evidence_class: phase0_acceptance
learning_measurement:
  required_fields:
  - founder_correction_effort
  - recommendation_override_reason
  - output_editing_time
  - repeated_manual_task
  - defect_category
  - missing_evidence_or_method
  - agent_contribution_accepted_or_rejected
  - task_completion_time
  - human_time_saved
  - quality_per_cost
  - client_facing_usefulness
  evidence_class: later_implementation_acceptance
cross_cutting:
  acceptance_criteria:
  - id: XC-TIME
    criterion: Singapore timezone and date handling are explicit and testable.
    evidence_class: phase0_acceptance
  - id: XC-UNIT
    criterion: Currency, unit and dimension consistency are validated.
    evidence_class: later_implementation_acceptance
  - id: XC-PORT
    criterion: Data export and portability do not depend on one agent or provider.
    evidence_class: later_implementation_acceptance
  - id: XC-MIGRATE
    criterion: Configuration and schema migrations preserve backward compatibility or provide reviewed migration paths.
    evidence_class: phase0_acceptance
  - id: XC-FONTS
    criterion: Font availability and substitution are detected before release.
    evidence_class: later_implementation_acceptance
  - id: XC-PRIV
    criterion: Privacy-safe telemetry is disabled by default until explicitly approved.
    evidence_class: phase0_acceptance
  - id: XC-MODEL
    criterion: Material work cannot silently degrade to a lower-quality model or provider route.
    evidence_class: later_implementation_acceptance
implementation_mapping:
  phase0_acceptance:
  - P0.1
  - P0.2
  - P0.3
  - P0.4
  later_implementation_acceptance:
  - P2
  - P3
  - P5
  - P6
  - P7
  - P11
  - P12
  founder_manual_gate:
  - issue_19_hosted_controls
  - clean_macos_environment
  - explicit_founder_approval
  executable_now:
  - PCR-10 deterministic build
  - PCR-10 schema and semantic validation
  - retained Phase 1-7/PCR-01-10 validation
issue_extension:
  base_body_path: handoff/codex-phase0-issue.md
  final_body_path: handoff/codex-phase0-issue-pcr10.md
  required_read_order_additions:
  - docs/49-PCR-10-PRE-CODEX-RELEASE-AND-QUALITY-ACCEPTANCE.md
  - contracts/pre-codex-readiness.json
  required_preflight_commands:
  - python scripts/build_pcr10_pre_codex_readiness.py
  - python scripts/validate_pcr10_pre_codex_readiness.py
boundaries:
  codex_start_authorized: false
  phase1_authorized: false
  runtime_activation_authorized: false
  hermes_activation_authorized: false
  northstar_implementation_authorized: false
  initial_operating_controls_activation_authorized: false
  real_client_data_enabled: false
  external_actions_authorized: false
  paid_services_authorized: false
  production_deployment_authorized: false
  autonomous_merge_authorized: false
  founder_accountability_preserved: true
