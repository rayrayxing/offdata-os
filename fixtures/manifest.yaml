version: 0.1.0
fixture_rules:
  data: synthetic_or_sanitised_only
  purpose: regression_and_acceptance_testing
  prohibited_use:
    - canned_client_answer
    - representation_of_real_outcome
  required_elements:
    - mandate
    - decision_owner
    - decision_date_or_gate
    - source_documents
    - interview_transcripts
    - structured_data
    - data_quality_defects
    - expected_problem_archetypes
    - acceptable_method_stacks
    - rejected_method_traps
    - expected_calculations
    - contradicting_evidence
    - expected_founder_interruptions
    - expected_story_structure
    - known_quality_defects
    - implementation_records
    - benefit_records
