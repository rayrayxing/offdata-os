mandate:
  initial_request: Prepare a growth strategy and recommend where to invest the next
    SGD 20 million.
  governing_decision: Which business units should receive growth capital, be restructured,
    partnered, divested or closed over the next three years?
  decision_owner: Group Chief Executive Officer
  decision_date: '2026-10-30'
  constraints:
  - Net new capital commitment must not exceed SGD 20 million before Founder approval.
  - No action may reduce safety-critical field-service coverage below current resilience
    thresholds.
  - No legal, tax, environmental or transaction conclusion may be issued without specialist
    review.
  - The recommendation must include at least one credible alternative portfolio.
  scope:
  - five operating business units
  - three-year portfolio and capital-allocation horizon
  - corporate advantage and parenting logic
  - base, downside and switching conditions
  - implementation commitments and benefit verification
  exclusions:
  - formal fairness opinion
  - binding valuation or transaction advice
  - legal entity restructuring
  - named buyer outreach
  counterfactual: Continue the current equal-allocation policy and approve business-unit
    proposals independently.
  governing_uncertainties:
  - Which businesses create value after capital intensity and cost of capital?
  - Where does HarborPeak have parenting or ownership advantage rather than market
    exposure alone?
  - Which portfolio remains acceptable in the downside scenario and within the net
    capital ceiling?
  - What staged evidence should trigger scale, partnership, divestiture or stop decisions?
