version: 1.0.0
defaults:
  jurisdiction: Singapore
  classification: synthetic
  scope: Board-sponsored diagnostic and recommendation using synthetic evidence only.
  constraints:
  - No external action
  - No real client data
  - Founder approval required for material release
  story_structure:
  - Decision
  - Evidence
  - Options
  - Recommendation
  - Implementation
  - Benefits and controls
  assumptions:
  - Demand remains within the defined scenario range.
  - Implementation capacity is available only in controlled waves.
  falsifiers:
  - Controlled data shows the recommendation underperforms the comparator.
  - A prerequisite cannot be met within the approved commitment or decision date.
  prohibited_conclusions:
  - The reference recommendation is guaranteed.
  - Released capacity is immediate cash savings.
fixtures:
- fixture_id: FIXTURE-STRATEGY-001
  engagement_type: corporate_and_business_unit_strategy
  working_title: Industrial services strategic growth choice
  client_name: Apex Field Services
  decision: Choose whether to prioritise regional expansion, vertical specialisation or adjacent digital services.
  decision_owner: Board strategy committee
  problem_archetypes:
  - market attractiveness and competitive position
  - portfolio and capability fit
  method_stack:
  - market sizing plus scenario economics
  - capability-gap and option assessment
  reference_recommendation: Prioritise two high-fit verticals in the home region before funding a digital-services adjacency.
  alternatives:
  - Acquire a small regional competitor now
  - Launch the digital adjacency immediately
  base_case_value_range_sgd: [51000, 305000]
  management_overclaim: Management confidence conflicts with controlled performance data.
  frontline_constraint: Front-line evidence identifies a prerequisite omitted from the preferred option.
