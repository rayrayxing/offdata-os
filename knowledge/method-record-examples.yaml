- method_id: METHOD-BENEFITS-M01
  name: Benefits dependency mapping
  aliases: []
  domains:
  - benefits_realisation_and_performance_improvement
  method_family: benefits_logic
  decisions_supported:
  - Whether an investment has a coherent route from enabling outputs through business
    change to measurable value.
  inference_types:
  - descriptive
  - normative
  appropriate_problem_types:
  - technology-enabled transformation
  - multi-project benefit overlap
  - cross-functional accountability
  preconditions:
  - strategic objectives are stated
  - business and enabling stakeholders can participate
  - assumptions may be challenged
  minimum_evidence: E2
  inputs:
  - strategic drivers
  - investment objectives
  - candidate outputs
  - business changes
  - owners and dependencies
  procedure:
  - state objectives and outcomes
  - map outputs to capabilities and behavioural changes
  - identify dependencies and owners
  - test duplicated or missing benefits
  - define evidence and recognition gates
  outputs:
  - benefits dependency map
  - accountability map
  - gap and overlap register
  strengths:
  - makes hidden dependencies visible
  limitations:
  - does not prove causal impact or realised value
  when_not_to_use:
  - a single local process improvement with direct measured output
  alternatives:
  - theory of change
  - benefit profile and register
  compatible_overlays:
  - benefits_realisation_and_performance_improvement
  conflicts: []
  redundancies: []
  tool_requirements:
  - diagramming
  - structured register
  specialist_review_requirements:
  - finance review for material value claims
  failure_modes:
  - outputs are treated as benefits
  - dependencies have no owners
  quality_tests:
  - every benefit has a traceable path and owner
  - overlapping benefits are reconciled
  falsification_tests:
  - remove a claimed enabling change and test whether the benefit still follows
  source_ids:
  - SOURCE-DOMAIN-BENEFITS
  usage_rights_status: internal_use_and_original_paraphrase_only_pending_confirmation
