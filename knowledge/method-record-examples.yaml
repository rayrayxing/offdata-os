- method_id: METHOD-GROWTH-GCS-01
  name: Revenue and growth decomposition
  aliases: []
  domains:
  - growth_and_commercial_strategy
  method_family: commercial_diagnostics
  decisions_supported:
  - Which measurable components explain revenue or contribution change and where management
    should investigate or intervene.
  inference_types:
  - descriptive
  - normative
  appropriate_problem_types:
  - revenue below plan
  - share erosion
  - price-volume-mix question
  - retention decline
  preconditions:
  - metric definitions consistent
  - defensible comparison period
  - stable product and customer mappings
  minimum_evidence: E2
  inputs:
  - units or contracts
  - prices and discounts
  - customers and cohorts
  - mix and currency
  - margin data
  procedure:
  - reconcile reported revenue
  - separate price, volume, mix, acquisition, retention and expansion
  - segment differences
  - link drivers to hypotheses
  - test alternative explanations
  outputs:
  - growth bridge
  - segment driver table
  - priority hypotheses
  strengths:
  - turns topline variance into testable drivers
  limitations:
  - decomposition is descriptive and does not prove causes
  when_not_to_use:
  - the market boundary or accounting basis is changing too materially to compare
  alternatives:
  - market sizing
  - cohort survival analysis
  compatible_overlays:
  - growth_and_commercial_strategy
  conflicts: []
  redundancies: []
  tool_requirements:
  - SQL or Python
  - spreadsheet reconciliation
  specialist_review_requirements:
  - finance and commercial owner review
  failure_modes:
  - double counting price and mix
  - currency or acquisition effects ignored
  quality_tests:
  - bridge reconciles to accounts
  - each driver has a defined denominator
  falsification_tests:
  - reclassifying a segment removes the apparent driver
