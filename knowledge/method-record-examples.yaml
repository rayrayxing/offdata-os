- method_id: METHOD-STRATEGY-STR-01
  name: Decision Framing and Option Architecture
  aliases: []
  domains:
  - corporate_and_business_unit_strategy
  method_family: decision_architecture
  decisions_supported:
  - What executives must decide, which options are feasible and which uncertainties
    can change the choice.
  inference_types:
  - descriptive
  - normative
  appropriate_problem_types:
  - ambiguous mandate
  - strategy reset
  - capital allocation
  - market entry
  preconditions:
  - named decision owner
  - decision gate or date
  - identifiable baseline
  - stakeholder access
  minimum_evidence: E2
  inputs:
  - objectives and constraints
  - existing commitments
  - decision rights
  - initial options
  - market and financial evidence
  procedure:
  - write a specific decision statement
  - separate objectives from proposed solutions
  - define do-minimum baseline
  - identify constraints
  - decompose necessary conditions
  - broaden then screen options
  outputs:
  - decision statement
  - option architecture
  - critical uncertainty register
  strengths:
  - prevents broad analysis without convergence
  limitations:
  - does not provide market or financial evidence by itself
  when_not_to_use:
  - the decision and options are already contractually fixed
  alternatives:
  - issue tree and hypothesis architecture
  - multi-criteria decision analysis
  compatible_overlays:
  - corporate_and_business_unit_strategy
  conflicts: []
  redundancies: []
  tool_requirements:
  - facilitation
  - option register
  specialist_review_requirements:
  - legal or finance review where constraints are binding
  failure_modes:
  - solution is embedded in the mandate
  - do-minimum option omitted
  quality_tests:
  - decision fits one sentence
  - options are mutually distinguishable
  - uncertainties link to tests
  falsification_tests:
  - a credible omitted option changes the decision boundary
  source_ids:
  - SOURCE-DOMAIN-STRATEGY
  usage_rights_status: internal_use_and_original_paraphrase_only_pending_confirmation
  version: 1.0.0
  promotion_state: review
  source_local_method_id: METHOD-STRATEGY-STR-01
  reconstruction_note: Source-grounded original reconstruction; no protected template,
    distinctive diagram or extended source wording is reproduced.
- method_id: METHOD-COST-CP-01
  name: Cost-driver tree and relevant-cost analysis
  aliases: []
  domains:
  - cost_and_productivity
  method_family: cost_economics
  decisions_supported:
  - Which cost drivers and avoidable costs change under pricing, sourcing, redesign,
    automation or portfolio choices.
  inference_types:
  - descriptive
  - normative
  appropriate_problem_types:
  - cost opacity
  - make-or-buy
  - special-order economics
  - early cost reduction
  preconditions:
  - decision and cost boundary defined
  - financial and operational volume data available
  - sunk and avoidable costs distinguishable
  minimum_evidence: E2
  inputs:
  - general ledger
  - management accounts
  - transaction volumes
  - resource consumption
  - commitment terms
  procedure:
  - define cost boundary
  - construct causal cost-driver tree
  - classify fixed, committed, avoidable and incremental costs
  - calculate unit economics
  - test volume and constraint sensitivities
  outputs:
  - driver tree
  - relevant-cost bridge
  - unit economics
  - sensitivity ranges
  strengths:
  - connects operational drivers to decision economics
  limitations:
  - allocated accounting cost may not equal avoidable cash cost
  when_not_to_use:
  - causal attribution requires an experiment or longitudinal design
  alternatives:
  - activity-based costing
  - cost-volume-profit analysis
  compatible_overlays:
  - cost_and_productivity
  conflicts: []
  redundancies: []
  tool_requirements:
  - spreadsheet or Python model
  specialist_review_requirements:
  - finance controller review
  failure_modes:
  - sunk cost treated as avoidable
  - allocation changes mistaken for savings
  quality_tests:
  - reconciles to controlled accounts
  - units and periods are explicit
  falsification_tests:
  - remove the assumed volume response and test decision switching
  source_ids:
