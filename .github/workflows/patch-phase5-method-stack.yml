name: Patch Phase 5 method stacks

on:
  push:
    branches: [fixtures/phase5-additional-engagements]
    paths:
      - .github/workflows/patch-phase5-method-stack.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixtures/phase5-additional-engagements
      - name: Patch minimum-sufficient method stack expansion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/offdata-core/src/offdata_core/fixture_programme.py')
          text = path.read_text(encoding='utf-8')
          old = 'acceptable_method_stacks=(methods, (methods[0], "assumption and falsifier review", "implementation feasibility")),'
          new = 'acceptable_method_stacks=(methods + ("decision synthesis",), (methods[0], "assumption and falsifier review", "implementation feasibility")),'
          if old not in text:
              raise SystemExit('expected source line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/offdata-core/src/offdata_core/fixture_programme.py
          git commit -m "fix(fixtures): complete minimum-sufficient method stacks"
          git push origin HEAD:fixtures/phase5-additional-engagements
