name: Retain Phase 4 generated records

on:
  push:
    branches: [deliverable/phase4-semantic-model]
    paths:
      - .github/workflows/retain-phase4-generated.yml

permissions:
  contents: write

jobs:
  retain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: deliverable/phase4-semantic-model
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Generate governed Phase 4 records
        run: |
          python scripts/build_test_registry.py
          python scripts/build_phase4_deliverable_semantic_model.py
      - name: Commit exact generated records
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/test-registry.json fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json
          git diff --cached --quiet && exit 1
          git commit -m "build(deliverables): retain Phase 4 generated records"
          git push origin HEAD:deliverable/phase4-semantic-model
