name: WS6.16 integration reconstruction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ws616-integration-reconstruction
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'governance/ws616-permanent-release-record'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws616-permanent-release-record
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct WS6.16 non-workflow preparation state
        run: |
          python -m pip install --quiet pyyaml jsonschema
          git fetch origin refs/pull/57/head:refs/remotes/origin/ws616-original --force
          git cat-file -e 4b8af8285d49c5a31df89b5c69f1e76f60221edf^{commit}
          python scripts/ws616_integration_repair.py
          git diff --check
          git config user.name 'offdata WS6 integration repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile WS6.16 preparation with integrated WS6.15 authority'
          git push origin HEAD:governance/ws616-permanent-release-record
