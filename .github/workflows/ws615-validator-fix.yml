name: WS6.15 validator repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 61 && github.event.pull_request.head.ref == 'governance/ws615-final-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws615-final-workflow
          persist-credentials: true
      - name: Correct activation-exception base SHA expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate_workstream6_final_workflow.py')
          text = p.read_text(encoding='utf-8')
          old = 'require(exception.get("base_sha") == "a4e45baf836c86d7264f08aa6d351a31caa896dd", "exception base SHA drift")'
          new = 'require(exception.get("base_sha") == "05e9dfa9f9038a56061d376e1783b78f9607665f", "exception base SHA drift")'
          if old not in text:
              raise SystemExit('expected WS6.15 base-SHA validator line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install --quiet jsonschema
          python scripts/build_workstream6_final_workflow.py
          python -m compileall -q scripts/validate_workstream6_final_workflow.py
          git diff --check
          git config user.name 'offdata WS6 integration repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_workstream6_final_workflow.py
          git commit -m 'Correct WS6.15 activation base-SHA validation'
          git push origin HEAD:governance/ws615-final-workflow
