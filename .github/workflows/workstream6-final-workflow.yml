name: Workstream 6 final workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-final-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-workflow-package:
    name: Validate WS6.15 final workflow package and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
