name: PCR-09 one-time document reconciliation

on:
  push:
    branches:
      - governance/pcr09-first-codex-issue-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/pcr09-first-codex-issue-clean
          fetch-depth: 0
      - name: Reconcile Phase 0 documents with PCR-09
        run: |
          python - <<'PY'
          from pathlib import Path

          block = '''

## PCR-09 first Codex issue contract

Before Phase 0 can be authorised, the generated first-issue contract must remain current and pass its dedicated validator:

- `contracts/codex-phase0-issue.json`
- `scripts/validate_pcr09_codex_issue.py`

Preparing or validating this contract does not authorise Codex to start.
'''
          for name in ('docs/14-CODEX-KICKOFF.md', 'docs/19-PHASE-0-VALIDATION-ADDENDUM.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'contracts/codex-phase0-issue.json' not in text or 'scripts/validate_pcr09_codex_issue.py' not in text:
                  path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY
          rm .github/workflows/pcr09-patch-doc-tokens.yml
      - name: Commit reconciled clean tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/14-CODEX-KICKOFF.md docs/19-PHASE-0-VALIDATION-ADDENDUM.md .github/workflows/pcr09-patch-doc-tokens.yml
          git commit -m 'PCR-09: reconcile Phase 0 document references'
          git push origin HEAD:governance/pcr09-first-codex-issue-clean
