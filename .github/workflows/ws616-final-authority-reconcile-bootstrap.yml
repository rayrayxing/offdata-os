name: WS6.16 final authority reconciliation bootstrap

on:
  push:
    branches: [governance/ws616-final-authority-reconciliation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == '' || github.head_ref == 'governance/ws616-final-authority-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws616-final-authority-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install reconciliation dependency
        run: python -m pip install PyYAML jsonschema

      - name: Preserve JSON-compatible authority source serialization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/reconcile_ws616_final_authority.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', 'import hashlib\nimport json\n', 1)
          old = '    update_yaml("configs/workstream6-canonical-authority.yaml", mutate_authority)'
          new = '''    authority_path = ROOT / "configs/workstream6-canonical-authority.yaml"\n    authority = yaml.safe_load(authority_path.read_text(encoding="utf-8"))\n    if not isinstance(authority, dict):\n        raise SystemExit("canonical authority source must be a mapping")\n    mutate_authority(authority)\n    authority_path.write_text(json.dumps(authority, ensure_ascii=False, separators=(",", ":")) + "\\n", encoding="utf-8")'''
          if old not in text:
              raise SystemExit('authority serialization patch target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Reconcile current authority and regenerate machine artifacts
        run: |
          python scripts/reconcile_ws616_final_authority.py
          python scripts/build_workstream6_current_status.py
          python scripts/build_workstream6_canonical_authority.py
          python scripts/build_pcr04_codex_handoff.py
          python scripts/validate_workstream6_current_status.py
          python scripts/validate_workstream6_canonical_authority.py
          python scripts/validate_pcr04_codex_handoff.py
          python scripts/require_workstream6_final_reconciliation.py

      - name: Remove bootstrap helper and commit deterministic outputs
        run: |
          rm scripts/reconcile_ws616_final_authority.py
          rm .github/workflows/ws616-final-authority-reconcile-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Reconcile current authority after WS6.16 final release'
          git push origin HEAD:governance/ws616-final-authority-reconciliation
