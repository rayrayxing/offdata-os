name: Hermes adoption and compatibility pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hermes-compatibility:
    name: Validate PCR-06 and retained PCR-04–05 boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Rebuild PCR-05 runtime adapter contracts
        run: python scripts/build_pcr05_runtime_adapters.py
      - name: Rebuild PCR-04 Codex handoff
        run: python scripts/build_pcr04_codex_handoff.py
      - name: Build PCR-06 Hermes compatibility pack
        run: python scripts/build_pcr06_hermes_compatibility.py
      - name: Enforce clean PCR-04–06 generated records
        run: git diff --exit-code -- contracts/runtime-adapter-contracts.json handoff/codex-phase0-handoff.json contracts/hermes-compatibility-pack.json
      - name: Validate PCR-05 runtime adapters
        run: python scripts/validate_pcr05_runtime_adapters.py
      - name: Validate PCR-04 Codex handoff
        run: python scripts/validate_pcr04_codex_handoff.py
      - name: Validate PCR-06 Hermes compatibility
        run: python scripts/validate_pcr06_hermes_compatibility.py
      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce static lint baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce type-check baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Retain PCR-06 compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offdata-hermes-compatibility-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            configs/hermes-compatibility.yaml
            contracts/hermes-compatibility-pack.json
            schemas/hermes-compatibility.schema.json
            scripts/build_pcr06_hermes_compatibility.py
            scripts/validate_pcr06_hermes_compatibility.py
            docs/45-PCR-06-HERMES-ADOPTION-AND-COMPATIBILITY-PACK.md
            reports/pcr06-validation-evidence.md
            contracts/runtime-adapter-contracts.json
            handoff/codex-phase0-handoff.json
