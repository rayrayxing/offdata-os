name: Workstream 6 baseline lock and defect register

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-baseline-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-baseline-lock:
    name: Validate WS6.0 baseline lock and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

