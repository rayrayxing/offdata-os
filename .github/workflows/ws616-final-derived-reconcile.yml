name: WS6.16 final derived-artifact reconciliation

on:
  push:
    branches: [governance/ws616-final-authority-reconciliation]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws616-final-authority-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Regenerate and validate final intended tree
        run: |
          rm .github/workflows/ws616-final-derived-reconcile.yml
          sed 's/^git diff --exit-code$/git diff --name-only/' scripts/run_ws62_ci.sh > /tmp/run_ws62_ci_reconcile.sh
          bash /tmp/run_ws62_ci_reconcile.sh

      - name: Commit only durable generated changes
        run: |
          git checkout HEAD -- .github/workflows/ws616-final-derived-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
          else
            git commit -m 'Regenerate governed artifacts after WS6.16 reconciliation'
            git push origin HEAD:governance/ws616-final-authority-reconciliation
          fi
