name: Retain Phase 5 generated records

on:
  push:
    branches: [fixtures/phase5-additional-engagements]
    paths:
      - .github/workflows/retain-phase5-generated.yml

permissions:
  contents: write

jobs:
  retain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: fixtures/phase5-additional-engagements
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Generate governed Phase 5 records
        run: |
          python scripts/build_test_registry.py
          python scripts/build_phase5_fixture_programme.py
      - name: Commit exact generated records
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/test-registry.json fixtures/additional-primary-fixtures.json
          git diff --cached --quiet && exit 1
          git commit -m "build(fixtures): retain Phase 5 generated records"
          git push origin HEAD:fixtures/phase5-additional-engagements
