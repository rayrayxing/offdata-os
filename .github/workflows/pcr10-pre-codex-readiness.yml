name: PCR-10 pre-Codex readiness and quality acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pcr10-pre-codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate complete chat-first Phase 1–7 and PCR-01–10 release
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

  retained-pin-inventory:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-pcr10-pin-inventory
          path: .

# Historical workflow identity and exact Node 24 action-pin inventory are retained.
# The reusable WS6.2 gate accepts only the final canonical issue body and runs all
# prior builders, validators, runtime tests, compilation, Ruff and strict MyPy.
