name: WS6.15 integration reconstruction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ws615-integration-reconstruction
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'governance/ws615-final-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws615-final-workflow
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct WS6.15 non-workflow state
        run: |
          python -m pip install --quiet pyyaml jsonschema
          git fetch origin refs/pull/56/head:refs/remotes/origin/ws615-original --force
          git cat-file -e 161014fd8598977d05e0d8c1ac9723739e54dcca^{commit}
          python scripts/ws615_integration_repair.py
          git config user.name 'offdata WS6 integration repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile WS6.15 with integrated WS6.14 authority'
          git push origin HEAD:governance/ws615-final-workflow
