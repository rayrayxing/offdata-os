name: Workstream 6 final launch control reconciliation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

env:
  EXPECTED_INTEGRATED_MAIN_SHA: 8ad0ea95b8d01c83347161e4ccf893f1844a219d
  WS615_HEAD_SHA: 1361fff88bd08ae16218673337621571a7d315c6

concurrency:
  group: workstream6-final-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-launch-control:
    name: Validate WS6.16 permanent release preparation and complete prior components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Rebuild, validate and test through current WS6.16 state
        run: bash scripts/run_ws62_ci.sh

      - name: Verify integrated main, live authority and WS6.16 state
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_RELEASE: releases/pre-codex-final-reconciliation-2026-08-06.json
        run: |
          mkdir -p ci-evidence
          git merge-base --is-ancestor "$WS615_HEAD_SHA" "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > ci-evidence/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/2" > ci-evidence/issue-2.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > ci-evidence/open-issues.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > ci-evidence/branches.json
          for pr in 49 50 51 52 53 54 60 61; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > "ci-evidence/pr-${pr}.json"
          done
          if [[ -f "$FINAL_RELEASE" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/62" > ci-evidence/pr-62.json
          fi
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def is_ancestor(base, head):
              return subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', base, head],
                  check=False,
              ).returncode == 0

          main_ref = load('ci-evidence/main-ref.json')
          live_main_sha = main_ref['object']['sha']
          assert load('ci-evidence/issue-1.json')['state'] == 'open'
          issue2 = load('ci-evidence/issue-2.json')
          assert issue2['state'] == 'closed' and issue2.get('state_reason') == 'duplicate'
          assert load('ci-evidence/issue-19.json')['state'] == 'open'
          assert {item['number'] for item in load('ci-evidence/open-issues.json') if 'pull_request' not in item} == {1, 19}
          names = {item['name'] for item in load('ci-evidence/branches.json')}
          assert 'main' in names and 'codex/phase-0-foundation' not in names

          expected_heads = {
              49: '46abab02ad08a3a1cca519391e0114555f11230c',
              50: '911e431551bb7eb41f1d5d1ccc9ff042f18858f9',
              51: 'ebd750f6e985d7a864d072a172d4d9343ce26a36',
              52: '9f138fd3f35fb9826c6da0ab696e83775312508e',
              53: '7fc1734b5a495f95c68c9adce1cc85783f3d0299',
              54: 'e22a8357c98c31b62c654ba3734b51b5671232f7',
              60: 'a4e45baf836c86d7264f08aa6d351a31caa896dd',
              61: '1361fff88bd08ae16218673337621571a7d315c6',
          }
          for number, head in expected_heads.items():
              pr = load(f'ci-evidence/pr-{number}.json')
              assert pr['state'] == 'closed' and pr['merged'] is True
              assert pr['base']['ref'] == 'main' and pr['head']['sha'] == head

          ws615 = load('contracts/workstream6-final-workflow.json')
          ws616 = load('contracts/workstream6-permanent-release-record.json')
          ledger = load('repository/workstream6-defect-closure-ledger.json')
          current = load('contracts/workstream6-current-status.json')
          authority = load('repository/canonical-authority-registry.json')
          handoff = load('handoff/codex-phase0-handoff.json')

          assert ws615['predecessor']['head_sha'] == 'a4e45baf836c86d7264f08aa6d351a31caa896dd'
          assert ws615['completion']['final_workflow_active'] is True
          assert ws615['completion']['permanent_release_complete'] is False
          assert ws615['completion']['next_permitted_work_package'] == 'WS6.16'
          assert ws616['predecessor']['head_sha'] == os.environ['WS615_HEAD_SHA']
          assert ws616['predecessor']['pull_request'] == 61
          assert ws616['predecessor']['integrated_to_main'] is True
          assert ws616['current_main']['observed_sha'] == os.environ['EXPECTED_INTEGRATED_MAIN_SHA']
          assert ws616['current_main']['integrated_through'] == 'WS6.15'
          assert ws616['current_main']['eligible_for_permanent_release'] is False
          assert ws616['finalization_precondition_count'] == 6
          assert ws616['satisfied_finalization_precondition_count'] == 1
          assert [item['satisfied'] for item in ws616['finalization_preconditions']] == [True, False, False, False, False, False]
          assert ws616['required_release_binding_field_count'] == 9
          assert ws616['completion']['release_machinery_prepared'] is True
          assert ws616['completion']['permanent_release_record_complete'] is False
          assert ws616['completion']['ws616_complete'] is False
          assert ws616['boundaries']['codex_start_authorized'] is False
          assert ledger['repository_addressed_count'] == 25 and ledger['expected_unresolved_count'] == 3
          assert 'WS6.16' in current['canonical_status_phrase']
          assert current['canonical_status_phrase'] == authority['canonical_status_phrase']
          assert handoff['readiness_snapshot']['final_workstream6_gate_complete'] is True
          assert handoff['readiness_snapshot']['codex_start_authorized'] is False
          assert handoff['boundaries']['launch_permit_issued'] is False

          release_path = Path(os.environ['FINAL_RELEASE'])
          if release_path.is_file():
              release = load(release_path)
              final_ledger = load('repository/workstream6-final-defect-closure-ledger.json')
              pr62 = load('ci-evidence/pr-62.json')
              assert pr62['state'] == 'closed' and pr62['merged'] is True
              assert pr62['base']['ref'] == 'main'
              assert pr62['head']['sha'] == release['preparation_head_sha'] == '4b83c8f1d80f83e82b05c30a0774b2e4ad62c200'
              assert release['preparation_pr_number'] == 62
              assert release['release_parent_main_sha'] == 'd3c4cb6097d0257a5bfdfc309ae4b3b1c2e7364c'
              assert release['tested_merge_reference'] == 'c13a78d48d19c2c9e968b8af8d85f08a69eb2d51'
              assert release['final_reconciliation_complete'] is True
              assert release['all_blocking_defects_closed'] is True
              assert release['codex_start_authorized'] is False
              assert final_ledger['all_blocking_defects_closed'] is True
              assert final_ledger['remaining_manual_defects'] == ['WS6-CONSIST-006']
              event = os.environ['GITHUB_EVENT_NAME']
              if event == 'pull_request':
                  payload = load(os.environ['GITHUB_EVENT_PATH'])
                  pr = payload['pull_request']
                  base_ref = pr['base']['ref']
                  base_sha = pr['base']['sha']
                  if base_ref == 'main':
                      assert live_main_sha == base_sha
                  else:
                      # Post-release corrective packages may be stacked, but their exact
                      # base must descend from live main and be included in the tested ref.
                      assert base_ref != 'codex/phase-0-foundation'
                      assert is_ancestor(live_main_sha, base_sha)
                      assert is_ancestor(base_sha, os.environ['GITHUB_SHA'])
                      if Path('repository/current-operational-state.json').is_file():
                          successor = load('repository/current-operational-state.json')
                          assert successor['manual_launch_gates']['codex_start_authorized'] is False
                          assert successor['boundaries']['merge_authorized'] is False
                          assert successor['boundaries']['phase0_implementation_authorized'] is False
              else:
                  assert live_main_sha == os.environ['GITHUB_SHA']
          else:
              assert live_main_sha == os.environ['EXPECTED_INTEGRATED_MAIN_SHA']
              assert not Path('reports/workstream6-final-evidence.md').exists()
              assert not Path('repository/workstream6-final-defect-closure-ledger.json').exists()
          PY

      - name: Assemble retained WS6.16 preparation evidence
        run: |
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\nmain_sha=%s\n' \
            "${{ github.event.pull_request.head.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$EXPECTED_INTEGRATED_MAIN_SHA" \
            > ci-evidence/run.txt
          : > ci-evidence/repository-digests.txt
          mkdir -p ci-evidence/package
          git ls-files -z | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$path" >> ci-evidence/repository-digests.txt
            destination="ci-evidence/package/$path"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
          done
          (cd ci-evidence/package && sha256sum -c ../repository-digests.txt)

      - name: Retain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream6-permanent-release-preparation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: ci-evidence

      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/ws62-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/ws62-pytest.log | tail -1)
          if [[ -f releases/pre-codex-final-reconciliation-2026-08-06.json ]]; then
            gh pr comment "$PR_NUMBER" --body "WS6.16 permanent-release gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. The permanent record binds preparation PR #62, exact tested merge ref, current final-check evidence and release-parent main. WS6-BLOCK-006 and WS6-CONSIST-010 are release-addressed; WS6-CONSIST-006 remains manual; codex_start_authorized=false."
          else
            gh pr comment "$PR_NUMBER" --body "WS6.16 release-preparation gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. Integrated main is \`$EXPECTED_INTEGRATED_MAIN_SHA\` through WS6.15. Finalization preconditions are truthfully 1/6: predecessor chain integrated, while preparation integration/current artifact/parent-main/release-branch gates remain pending. WS6-BLOCK-006 and WS6-CONSIST-010 remain open until the permanent record is generated; WS6-CONSIST-006 remains manual; codex_start_authorized=false."
          fi