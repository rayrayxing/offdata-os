name: Workstream 6 final launch control reconciliation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

env:
  EXPECTED_INTEGRATED_MAIN_SHA: 05e9dfa9f9038a56061d376e1783b78f9607665f
  WS614_HEAD_SHA: a4e45baf836c86d7264f08aa6d351a31caa896dd

concurrency:
  group: workstream6-final-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-launch-control:
    name: Validate WS6.15 final workflow package and complete prior components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Rebuild, validate and test through WS6.15
        run: bash scripts/run_ws62_ci.sh

      - name: Verify integrated main, live authority and WS6.15 activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-evidence
          git merge-base --is-ancestor "$WS614_HEAD_SHA" "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > ci-evidence/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/2" > ci-evidence/issue-2.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > ci-evidence/open-issues.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > ci-evidence/branches.json
          for pr in 49 50 51 52 53 54 60; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > "ci-evidence/pr-${pr}.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          main_ref = load("ci-evidence/main-ref.json")
          assert main_ref["object"]["sha"] == os.environ["EXPECTED_INTEGRATED_MAIN_SHA"]
          assert load("ci-evidence/issue-1.json")["state"] == "open"
          issue2 = load("ci-evidence/issue-2.json")
          assert issue2["state"] == "closed" and issue2.get("state_reason") == "duplicate"
          assert load("ci-evidence/issue-19.json")["state"] == "open"
          assert {item["number"] for item in load("ci-evidence/open-issues.json") if "pull_request" not in item} == {1, 19}
          names = {item["name"] for item in load("ci-evidence/branches.json")}
          assert "main" in names and "codex/phase-0-foundation" not in names

          expected_heads = {
              49: "46abab02ad08a3a1cca519391e0114555f11230c",
              50: "911e431551bb7eb41f1d5d1ccc9ff042f18858f9",
              51: "ebd750f6e985d7a864d072a172d4d9343ce26a36",
              52: "9f138fd3f35fb9826c6da0ab696e83775312508e",
              53: "7fc1734b5a495f95c68c9adce1cc85783f3d0299",
              54: "e22a8357c98c31b62c654ba3734b51b5671232f7",
              60: "a4e45baf836c86d7264f08aa6d351a31caa896dd",
          }
          for number, head in expected_heads.items():
              pr = load(f"ci-evidence/pr-{number}.json")
              assert pr["state"] == "closed" and pr["merged"] is True
              assert pr["base"]["ref"] == "main" and pr["head"]["sha"] == head

          ws614 = load("contracts/workstream6-cross-authority-consistency-gate.json")
          ws615 = load("contracts/workstream6-final-workflow.json")
          ledger = load("repository/workstream6-defect-closure-ledger.json")
          current = load("contracts/workstream6-current-status.json")
          authority = load("repository/canonical-authority-registry.json")
          identity = load("contracts/workstream6-required-workflow-identity.json")
          handoff = load("handoff/codex-phase0-handoff.json")

          assert ws614["authority_domain_count"] == 12
          assert ws614["defect_count"] == 28 and ws614["repository_addressed_count"] == 25 and ws614["expected_unresolved_count"] == 3
          assert ws614["completion"]["final_workflow_active"] is False
          assert ws614["completion"]["next_permitted_work_package"] == "WS6.15"
          assert ws615["predecessor"]["head_sha"] == os.environ["WS614_HEAD_SHA"]
          assert ws615["predecessor"]["integrated_to_main"] is True
          assert ws615["main_integration"]["integrated_main_sha"] == os.environ["EXPECTED_INTEGRATED_MAIN_SHA"]
          assert ws615["main_integration"]["integrated_through"] == "WS6.14"
          assert ws615["main_integration"]["earliest_unintegrated"] == "WS6.15"
          assert ws615["canonical_identity"]["job_name"] == "Validate final pre-Codex canonical handoff and complete release"
          assert ws615["activation"]["state"] == "active_fail_closed_pending_permanent_release"
          assert ws615["automatic_trigger_count"] == 3
          assert ws615["completion"]["final_workflow_active"] is True
          assert ws615["completion"]["permanent_release_complete"] is False
          assert ws615["completion"]["manual_launch_gates_complete"] is False
          assert ws615["completion"]["next_permitted_work_package"] == "WS6.16"
          assert ws615["remaining_defects"] == ["WS6-BLOCK-006", "WS6-CONSIST-006", "WS6-CONSIST-010"]
          assert ws615["boundaries"]["codex_start_authorized"] is False
          assert ledger["repository_addressed_count"] == 25 and ledger["expected_unresolved_count"] == 3
          assert "WS6.14" in current["canonical_status_phrase"]
          assert current["canonical_status_phrase"] == authority["canonical_status_phrase"]
          assert identity["canonical_identity"]["job_name"] == ws615["canonical_identity"]["job_name"]
          assert identity["activation"]["activation_work_package"] == "WS6.15"
          assert handoff["readiness_snapshot"]["codex_start_authorized"] is False
          assert handoff["boundaries"]["launch_permit_issued"] is False
          assert not Path("releases/pre-codex-final-reconciliation-2026-08-06.json").exists()
          PY

      - name: Assemble retained WS6.15 evidence
        run: |
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\nmain_sha=%s\n' \
            "${{ github.event.pull_request.head.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$EXPECTED_INTEGRATED_MAIN_SHA" \
            > ci-evidence/run.txt
          : > ci-evidence/repository-digests.txt
          mkdir -p ci-evidence/package
          git ls-files -z | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$path" >> ci-evidence/repository-digests.txt
            destination="ci-evidence/package/$path"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
          done
          (cd ci-evidence/package && sha256sum -c ../repository-digests.txt)

      - name: Retain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream6-final-workflow-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: ci-evidence

      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/ws62-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/ws62-pytest.log | tail -1)
          gh pr comment "$PR_NUMBER" --body "WS6.15 final-workflow package gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. Integrated main is \`$EXPECTED_INTEGRATED_MAIN_SHA\` through WS6.14. The exact final check identity is active for pull requests, pushes to main and manual dispatch, with one exact WS6.15 activation-PR exception. Every other run requires the WS6.16 permanent release. Exactly WS6-BLOCK-006, WS6-CONSIST-006 and WS6-CONSIST-010 remain unresolved; codex_start_authorized=false."
