name: Workstream 6 final launch control reconciliation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-final-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-launch-control:
    name: Validate WS6.2 final launch control and complete prior components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Rebuild, validate and test through WS6.2
        run: bash scripts/run_ws62_ci.sh

      - name: Verify exact WS6.1 ancestry and live fail-closed state
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_MAIN_SHA: a3fb3ea21029f01c52bc8e871dd7bcb284a31f7c
        run: |
          mkdir -p ci-evidence
          git merge-base --is-ancestor "$BASE_MAIN_SHA" "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > ci-evidence/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/2" > ci-evidence/issue-2.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > ci-evidence/branches.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          issue1 = json.loads(Path("ci-evidence/issue-1.json").read_text())
          issue2 = json.loads(Path("ci-evidence/issue-2.json").read_text())
          issue19 = json.loads(Path("ci-evidence/issue-19.json").read_text())
          branches = json.loads(Path("ci-evidence/branches.json").read_text())
          expected = Path("handoff/codex-phase0-issue-final.md").read_bytes()

          assert issue1["state"] == "open"
          assert hashlib.sha256(issue1.get("body", "").encode()).hexdigest() == hashlib.sha256(expected).hexdigest()
          assert issue2["state"] == "closed" and issue2.get("state_reason") == "duplicate"
          assert issue19["state"] in {"open", "closed"}
          if issue19["state"] == "closed":
              assert issue19.get("state_reason") == "completed"
          names = {item["name"] for item in branches}
          assert "main" in names
          assert "codex/phase-0-foundation" not in names
          PY

      - name: Assemble retained WS6.2 evidence
        run: |
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\n' \
            "${{ github.event.pull_request.head.sha }}" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            > ci-evidence/run.txt
          sha256sum \
            configs/codex-phase0-launch-control.yaml \
            contracts/codex-phase0-launch-control.json \
            handoff/codex-phase0-issue-final.md \
            schemas/codex-phase0-launch-control.schema.json \
            schemas/codex-phase0-launch-evidence.schema.json \
            schemas/codex-phase0-launch-permit.schema.json \
            configs/workstream6-final-launch-control.yaml \
            contracts/workstream6-final-launch-control.json \
            reports/workstream6-final-launch-control-evidence.md \
            > ci-evidence/repository-digests.txt

      - name: Retain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream6-final-launch-control-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            ci-evidence
            configs/codex-phase0-launch-control.yaml
            contracts/codex-phase0-launch-control.json
            handoff/codex-phase0-issue-final.md
            handoff/codex-phase0-issue-workstream5.md
            schemas/codex-phase0-launch-control.schema.json
            schemas/codex-phase0-launch-evidence.schema.json
            schemas/codex-phase0-launch-permit.schema.json
            handoff/codex-phase0-hosted-controls-attestation.template.json
            handoff/codex-phase0-clean-macos-attestation.template.json
            handoff/codex-phase0-founder-authorization.template.json
            handoff/codex-phase0-launch-ack.template.json
            scripts/run_ws62_ci.sh
            scripts/build_workstream5_launch_control.py
            scripts/validate_workstream5_launch_control.py
            scripts/codex_phase0_launch_core.py
            scripts/codex_phase0_launch_selftest.py
            scripts/prepare_codex_phase0_launch.py
            configs/workstream6-final-launch-control.yaml
            contracts/workstream6-final-launch-control.json
            schemas/workstream6-final-launch-control.schema.json
            scripts/build_workstream6_final_launch_control.py
            scripts/validate_workstream6_final_launch_control.py
            docs/54-WS6-2-FINAL-LAUNCH-CONTROL-RECONCILIATION.md
            reports/workstream6-final-launch-control-evidence.md

      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/ws62-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/ws62-pytest.log | tail -1)
          gh pr comment "$PR_NUMBER" --body "WS6.2 final launch-control gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. The final WS6.2 issue digest, final-release gate, exact status-check identity, launch verifier, all prior components, compilation, Ruff and strict MyPy passed. No permit was emitted and Codex remains unauthorized."
