name: Workstream 6 final launch control reconciliation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

env:
  EXPECTED_INTEGRATED_MAIN_SHA: cb2bffe74e62804250ac36168c4206cb8b9d021a
  WS613_HEAD_SHA: 5a7c39f55c9d2e69e1be45894dfb82db53af4fa8

concurrency:
  group: workstream6-final-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-launch-control:
    name: Validate WS6.14 cross-authority consistency gate and complete prior components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Rebuild, validate and test through WS6.14
        run: bash scripts/run_ws62_ci.sh

      - name: Verify integrated main, live authority and stacked predecessors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-evidence
          git merge-base --is-ancestor "$WS613_HEAD_SHA" "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > ci-evidence/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/2" > ci-evidence/issue-2.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > ci-evidence/open-issues.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > ci-evidence/branches.json
          for pr in 49 50 51 52 53 54; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > "ci-evidence/pr-${pr}.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          main_ref = load("ci-evidence/main-ref.json")
          assert main_ref["object"]["sha"] == os.environ["EXPECTED_INTEGRATED_MAIN_SHA"]
          issue1, issue2, issue19 = [load(f"ci-evidence/issue-{n}.json") for n in (1, 2, 19)]
          assert issue1["state"] == "open"
          assert issue2["state"] == "closed" and issue2.get("state_reason") == "duplicate"
          assert issue19["state"] == "open"
          open_items = load("ci-evidence/open-issues.json")
          assert {item["number"] for item in open_items if "pull_request" not in item} == {1, 19}
          branches = load("ci-evidence/branches.json")
          names = {item["name"] for item in branches}
          assert "main" in names and "codex/phase-0-foundation" not in names

          expected = {
              49: ("main", "46abab02ad08a3a1cca519391e0114555f11230c"),
              50: ("governance/ws68-issue-backlog-normalization", "911e431551bb7eb41f1d5d1ccc9ff042f18858f9"),
              51: ("governance/ws69-implementation-obligation-map", "ebd750f6e985d7a864d072a172d4d9343ce26a36"),
              52: ("governance/ws610-developer-experience-specification", "9f138fd3f35fb9826c6da0ab696e83775312508e"),
              53: ("governance/ws611-founder-experience-specification", "b6e6ba2a8408b7634a0d7e31980f5b505bc726a5"),
              54: ("governance/ws612-deliverable-quality-implementation-specification", "5a7c39f55c9d2e69e1be45894dfb82db53af4fa8"),
          }
          for number, (base, head) in expected.items():
              pr = load(f"ci-evidence/pr-{number}.json")
              assert pr["state"] == "open" and pr["draft"] is True and pr["merged"] is False
              assert pr["base"]["ref"] == base and pr["head"]["sha"] == head

          gate = load("contracts/workstream6-cross-authority-consistency-gate.json")
          ledger = load("repository/workstream6-defect-closure-ledger.json")
          current = load("contracts/workstream6-current-status.json")
          authority = load("repository/canonical-authority-registry.json")
          phase = load("contracts/workstream6-phase-namespace.json")
          workflow = load("contracts/workstream6-required-workflow-identity.json")
          operational = load("contracts/operational-quality-specification.json")
          licence = load("contracts/phase0-licence-decision-placeholder.json")

          assert gate["predecessor"]["head_sha"] == os.environ["WS613_HEAD_SHA"]
          assert gate["main_integration"]["integrated_main_sha"] == os.environ["EXPECTED_INTEGRATED_MAIN_SHA"]
          assert gate["main_integration"]["integrated_through"] == "WS6.7"
          assert gate["main_integration"]["earliest_unintegrated"] == "WS6.8"
          assert gate["authority_domain_count"] == 12
          assert gate["defect_count"] == 28 and gate["repository_addressed_count"] == 25 and gate["expected_unresolved_count"] == 3
          assert set(gate["expected_unresolved_defects"]) == {"WS6-BLOCK-006", "WS6-CONSIST-006", "WS6-CONSIST-010"}
          assert gate["completion"]["final_workflow_active"] is False
          assert gate["completion"]["permanent_release_complete"] is False
          assert gate["completion"]["manual_launch_gates_complete"] is False
          assert gate["completion"]["next_permitted_work_package"] == "WS6.15"
          assert gate["boundaries"]["codex_start_authorized"] is False
          assert ledger["repository_addressed_count"] == 25 and ledger["expected_unresolved_count"] == 3
          assert current["canonical_status_phrase"] == gate["canonical_status_phrase"]
          assert authority["canonical_status_phrase"] == gate["canonical_status_phrase"]
          assert any(item["prefix"] == "IMP-P" and item["state"] == "not_started" for item in phase["namespaces"])
          assert workflow["canonical_identity"]["job_name"] == "Validate final pre-Codex canonical handoff and complete release"
          assert workflow["activation"]["activation_work_package"] == "WS6.15"
          assert workflow["activation"]["automatic_triggers_enabled"] is False
          assert operational["completion"]["telemetry_enabled"] is False
          assert licence["licence_state"]["selected_licence"] is None
          assert licence["licence_state"]["implicit_licence_grant"] is False
          PY

      - name: Assemble retained WS6.14 evidence
        run: |
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\nmain_sha=%s\n' \
            "${{ github.event.pull_request.head.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$EXPECTED_INTEGRATED_MAIN_SHA" \
            > ci-evidence/run.txt
          : > ci-evidence/repository-digests.txt
          mkdir -p ci-evidence/package
          git ls-files -z | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$path" >> ci-evidence/repository-digests.txt
            destination="ci-evidence/package/$path"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
          done
          (cd ci-evidence/package && sha256sum -c ../repository-digests.txt)

      - name: Retain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream6-cross-authority-consistency-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: ci-evidence

      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/ws62-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/ws62-pytest.log | tail -1)
          gh pr comment "$PR_NUMBER" --body "WS6.14 cross-authority consistency gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. Current status and canonical authority agree that integrated main is \`$EXPECTED_INTEGRATED_MAIN_SHA\` through WS6.7 and WS6.8+ remain unintegrated. Twelve authority domains reconcile phase namespace, exact required workflow identity, issues, launch controls, implementation obligations, developer/Founder experience, deliverable quality, operational quality, licence state and defect closure. The closure overlay contains 28 baseline defects: 25 repository-addressed and exactly WS6-BLOCK-006, WS6-CONSIST-006 and WS6-CONSIST-010 unresolved by design. The final workflow remains reserved/manual-only for WS6.15, the permanent release remains WS6.16, no permit exists and Codex remains unauthorized."
