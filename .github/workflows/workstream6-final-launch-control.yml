name: Workstream 6 final launch control reconciliation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-final-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-launch-control:
    name: Validate WS6.13 operational quality specification and complete prior components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Rebuild, validate and test through WS6.13
        run: bash scripts/run_ws62_ci.sh

      - name: Verify exact WS6.12 ancestry and live fail-closed state
        env:
          GH_TOKEN: ${{ github.token }}
          WS612_HEAD_SHA: b6e6ba2a8408b7634a0d7e31980f5b505bc726a5
        run: |
          mkdir -p ci-evidence
          git merge-base --is-ancestor "$WS612_HEAD_SHA" "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > ci-evidence/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > ci-evidence/open-issues.json
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > ci-evidence/branches.json
          python - <<'PY'
          import json
          from pathlib import Path

          issue1 = json.loads(Path("ci-evidence/issue-1.json").read_text())
          issue19 = json.loads(Path("ci-evidence/issue-19.json").read_text())
          open_items = json.loads(Path("ci-evidence/open-issues.json").read_text())
          branches = json.loads(Path("ci-evidence/branches.json").read_text())
          renderer_prep = json.loads(Path("contracts/workstream6-renderer-preimplementation-assets.json").read_text())
          operational = json.loads(Path("contracts/operational-quality-specification.json").read_text())
          blueprint = json.loads(Path("contracts/phase0-implementation-blueprint.json").read_text())
          api = json.loads(Path("contracts/api-interface-contracts.json").read_text())
          knowledge = json.loads(Path("contracts/knowledge-ingestion-contracts.json").read_text())
          registry = json.loads(Path("tests/registry/ws613-planned-acceptance-tests.json").read_text())
          overlay = json.loads(Path("requirements/implementation-obligation-test-registration.json").read_text())

          assert issue1["state"] == "open"
          assert issue19["state"] == "open"
          open_issue_numbers = {item["number"] for item in open_items if "pull_request" not in item}
          assert open_issue_numbers == {1, 19}
          names = {item["name"] for item in branches}
          assert "main" in names
          assert "codex/phase-0-foundation" not in names

          assert renderer_prep["closed_defects"] == ["WS6-CODEXPREP-006"]
          assert renderer_prep["renderer_count"] == 6
          assert renderer_prep["golden_entry_count"] == 6
          assert renderer_prep["completion"]["physical_renderer_outputs_present"] is False
          assert renderer_prep["completion"]["approved_golden_baselines_present"] is False

          assert operational["predecessor"]["head_sha"] == "b6e6ba2a8408b7634a0d7e31980f5b505bc726a5"
          assert operational["operational_signal_count"] == 8
          assert operational["learning_metric_count"] == 11
          assert operational["test_registration"]["phase0_total"] == 76
          assert operational["test_registration"]["planned_total"] == 83
          assert operational["test_registration"]["executable"] == 0
          assert operational["remaining_preparation_defects"] == []
          assert operational["remaining_blocking_defects"] == ["WS6-BLOCK-006"]
          assert operational["completion"]["telemetry_enabled"] is False
          assert operational["boundaries"]["codex_start_authorized"] is False
          assert operational["boundaries"]["external_actions_authorized"] is False

          assert blueprint["task_count"] == 4
          assert blueprint["service_count"] == 4
          assert blueprint["root_command_count"] == 15
          assert blueprint["registered_phase0_test_count"] == 76
          assert blueprint["status"] == "planned_not_implemented"
          assert blueprint["network"] == {"binding": "loopback_only", "external_default": "denied", "paid_cloud": False}
          assert not any(blueprint["guards"].values())

          assert api["binding"] == "loopback_only" and api["external_binding"] is False and api["runtime_active"] is False
          assert knowledge["ingestion"]["real_document_import"] is False
          assert knowledge["external_object_storage"] is False and knowledge["runtime_active"] is False
          assert registry["counts"]["phase0_total"] == 76
          assert registry["counts"]["conformance"] == 7
          assert registry["counts"]["executable"] == 0
          assert registry["defaults"]["registration_status"] == "registered_planned"
          assert registry["defaults"]["executable"] is False
          assert overlay["registration_count"] == 16 and overlay["source_map_immutable"] is True
          PY

      - name: Assemble retained WS6.13 evidence
        run: |
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\n' \
            "${{ github.event.pull_request.head.sha }}" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            > ci-evidence/run.txt
          : > ci-evidence/repository-digests.txt
          mkdir -p ci-evidence/package
          git ls-files -z | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$path" >> ci-evidence/repository-digests.txt
            destination="ci-evidence/package/$path"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
          done
          (
            cd ci-evidence/package
            sha256sum -c ../repository-digests.txt
          )

      - name: Retain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream6-operational-quality-specification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: ci-evidence

      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/ws62-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/ws62-pytest.log | tail -1)
          gh pr comment "$PR_NUMBER" --body "WS6.13 operational-quality-specification gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. Eight operational signals and eleven learning metrics are governed with source, privacy, retention, phase availability and evidence; telemetry/export/raw content remain disabled. The P0.1-P0.4 topology, API/UI shell, storage/ingestion contracts, 76 registered planned IMP-P0 tests and seven workflow/agent conformance cases remain planning-only with zero new executable evidence. WS6-QUALITY-005 and WS6-CODEXPREP-001 through -005 are closed by this package; WS6-BLOCK-006 remains open. All prior builders and validators, launch self-tests, compilation, Ruff and strict MyPy passed. Every tracked file was checksum-staged before artifact upload. The reserved final workflow remains inactive, no permit was emitted and Codex remains unauthorized."
