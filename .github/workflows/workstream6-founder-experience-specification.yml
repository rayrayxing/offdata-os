name: Workstream 6 Founder experience specification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-founder-experience-specification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-founder-experience-specification:
    name: Validate WS6.11 Founder experience specification and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
