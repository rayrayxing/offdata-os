name: WS6.15 workflow-token repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 61 && github.event.pull_request.head.ref == 'governance/ws615-final-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/ws615-final-workflow
          persist-credentials: true
      - name: Correct final-workflow base-SHA token expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate_workstream6_final_workflow.py')
          text = p.read_text(encoding='utf-8')
          old = '        "a4e45baf836c86d7264f08aa6d351a31caa896dd",\n'
          new = '        "05e9dfa9f9038a56061d376e1783b78f9607665f",\n'
          if old not in text:
              raise SystemExit('stale WS6.14 workflow token not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install --quiet jsonschema
          python scripts/validate_workstream6_final_workflow.py
          git diff --check
          git config user.name 'offdata WS6 integration repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_workstream6_final_workflow.py
          git commit -m 'Correct WS6.15 canonical workflow token validation'
          git push origin HEAD:governance/ws615-final-workflow
