name: Machine contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Generate and validate machine contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install offdata-core validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"

      - name: Build requirement test registry
        run: python scripts/build_test_registry.py

      - name: Generate schemas, catalogues and OpenAPI
        run: python scripts/export_machine_contracts.py

      - name: Validate Phase 1 contract release
        run: python scripts/validate_phase1_contracts.py

      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing

      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts

      - name: Static lint advisory baseline
        continue-on-error: true
        run: ruff check packages/offdata-core/src packages/offdata-core/tests scripts

      - name: Type-check advisory baseline
        continue-on-error: true
        working-directory: packages/offdata-core
        run: mypy src

      - name: Retain generated machine contracts
        uses: actions/upload-artifact@v4
        with:
          name: offdata-machine-contracts-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            api/openapi.json
            schemas/*.json
            contracts/*.json
            requirements/test-registry.json
            configs/*.yaml
            database/migrations/*.sql
