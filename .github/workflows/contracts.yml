name: Machine contracts, agents, oracle, deliverables, fixtures, knowledge, security, governance and Codex handoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    name: Validate complete chat-first Phase 1–7 and PCR-01–04 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install offdata-core validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Build executable requirement test view
        run: python scripts/build_test_registry.py
      - name: Build PCR-02 semantic test and referential-integrity records
        run: python scripts/build_pcr02_test_identity.py
      - name: Generate schemas, catalogues and OpenAPI
        run: python scripts/export_machine_contracts.py
      - name: Validate Phase 1 contract release
        run: python scripts/validate_phase1_contracts.py
      - name: Validate Phase 2 agent system
        run: python scripts/validate_phase2_agents.py
      - name: Build Phase 3 AI-audit analytical oracle
        run: python scripts/build_phase3_oracle.py
      - name: Validate Phase 3 AI-audit analytical oracle
        run: python scripts/validate_phase3_ai_audit_oracle.py
      - name: Build Phase 4 deliverable semantic model
        run: python scripts/build_phase4_deliverable_semantic_model.py
      - name: Validate Phase 4 deliverable semantic model
        run: python scripts/validate_phase4_deliverable_semantic_model.py
      - name: Build Phase 5 additional fixture programme
        run: python scripts/build_phase5_fixture_programme.py
      - name: Validate Phase 5 additional fixture programme
        run: python scripts/validate_phase5_fixture_programme.py
      - name: Build Phase 6 knowledge-ingestion intelligence
        run: python scripts/build_phase6_knowledge_intelligence.py
      - name: Validate Phase 6 knowledge-ingestion intelligence
        run: python scripts/validate_phase6_knowledge_intelligence.py
      - name: Build Phase 7 security and regionalisation
        run: python scripts/build_phase7_security_regionalisation.py
      - name: Rebuild PCR-02 after all governed source generation
        run: python scripts/build_pcr02_test_identity.py
      - name: Build PCR-01 canonical release reconciliation
        run: python scripts/build_pcr01_canonical_release.py
      - name: Build PCR-03 repository governance baseline
        run: python scripts/build_pcr03_repository_hygiene.py
      - name: Build PCR-04 machine-readable Codex handoff
        run: python scripts/build_pcr04_codex_handoff.py
      - name: Enforce clean generated Phase 1–7 and PCR-01–04 records
        run: git diff --exit-code -- requirements/test-registry.json requirements/test-definitions.json requirements/referential-integrity-baseline.json fixtures/additional-primary-fixtures.json fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json knowledge/knowledge-ingestion-baseline.json security/security-regionalisation-baseline.json releases/canonical-chat-first-phase1-7-release.json repository/repository-governance-baseline.json handoff/codex-phase0-handoff.json
      - name: Validate Phase 7 security and regionalisation
        run: python scripts/validate_phase7_security_regionalisation.py
      - name: Validate PCR-01 canonical release reconciliation
        run: python scripts/validate_pcr01_canonical_release.py
      - name: Validate PCR-02 test identity and referential integrity
        run: python scripts/validate_pcr02_referential_integrity.py
      - name: Validate PCR-03 repository and governance hygiene
        run: python scripts/validate_pcr03_repository_hygiene.py
      - name: Validate PCR-04 machine-readable Codex handoff
        run: python scripts/validate_pcr04_codex_handoff.py
      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce static lint baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce type-check baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Retain generated chat-first release and Codex handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offdata-chat-first-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            AGENTS.md
            README.md
            CONTRIBUTING.md
            GOVERNANCE.md
            SECURITY.md
            .github/CODEOWNERS
            .github/pull_request_template.md
            .github/ISSUE_TEMPLATE/*.yml
            .github/dependabot.yml
            api/openapi.json
            schemas/*.json
            contracts/*.json
            requirements/test-registry.json
            requirements/test-definitions.yaml
            requirements/test-definitions.json
            requirements/referential-integrity-baseline.json
            requirements/implemented-test-mappings*.json
            requirements/completed-planned-tests*.json
            configs/*.yaml
            handoff/*.json
            repository/repository-governance-baseline.json
            agents/**/SKILL.md
            fixtures/additional-primary-fixture-seeds.yaml
            fixtures/additional-primary-fixtures.json
            fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json
            fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json
            knowledge/*.yaml
            knowledge/*.json
            security/README.md
            security/*.yaml
            security/*.json
            releases/*.json
            database/migrations/*.sql
            docs/00-START-HERE.md
            docs/10-TESTING-STRATEGY.md
            docs/11-BUILD-BACKLOG.md
            docs/14-CODEX-KICKOFF.md
            docs/19-PHASE-0-VALIDATION-ADDENDUM.md
            docs/20-DEVELOPMENT-STATUS.md
            docs/42-PCR-03-REPOSITORY-AND-GOVERNANCE-HYGIENE.md
            docs/43-PCR-04-MACHINE-READABLE-CODEX-HANDOFF.md
            reports/pcr04-validation-evidence.md
            scripts/build_pcr04_codex_handoff.py
            scripts/validate_pcr04_codex_handoff.py
            packages/offdata-core/pyproject.toml
