name: Machine contracts, agents, oracle, deliverables, fixtures, knowledge, security and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-pcr02:
    name: Repair PCR-02 strict typing boundary
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'governance/pcr02-test-identity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out PCR-02 branch
        uses: actions/checkout@v4
        with:
          ref: governance/pcr02-test-identity
          fetch-depth: 0
      - name: Repair nullable security-test identifier assignment
        id: repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/offdata-core/src/offdata_core/referential_integrity.py")
          text = path.read_text(encoding="utf-8")
          i8 = " " * 8
          i12 = " " * 12
          old = "\n".join(
              [
                  f'{i8}test_id = record.get("test_id")',
                  f"{i8}if not isinstance(test_id, str):",
                  f'{i12}raise ValueError("Security test is missing test_id.")',
                  f'{i8}kind = str(record.get("kind", "unknown"))',
                  f'{i8}stage = str(record.get("execution_stage", "unknown"))',
                  f'{i8}requirements = set(_string_tuple(record.get("requirement_ids"), test_id))',
                  f'{i8}controls = set(_string_tuple(record.get("control_ids"), test_id))',
                  f"{i8}seed = seeds.setdefault(",
                  f"{i12}test_id,",
              ]
          )
          new = "\n".join(
              [
                  f'{i8}security_test_id = record.get("test_id")',
                  f"{i8}if not isinstance(security_test_id, str):",
                  f'{i12}raise ValueError("Security test is missing test_id.")',
                  f'{i8}kind = str(record.get("kind", "unknown"))',
                  f'{i8}stage = str(record.get("execution_stage", "unknown"))',
                  f'{i8}requirements = set(_string_tuple(record.get("requirement_ids"), security_test_id))',
                  f'{i8}controls = set(_string_tuple(record.get("control_ids"), security_test_id))',
                  f"{i8}seed = seeds.setdefault(",
                  f"{i12}security_test_id,",
              ]
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              Path("/tmp/pcr02-repaired").write_text("true", encoding="utf-8")
          elif new not in text:
              raise SystemExit("Expected PCR-02 assignment boundary not found")
          PY
          if [ -f /tmp/pcr02-repaired ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/offdata-core/src/offdata_core/referential_integrity.py
          git commit -m "Fix PCR-02 strict typing boundary"
          git push origin HEAD:governance/pcr02-test-identity

  validate-contracts:
    name: Validate complete chat-first Phase 1–7 and PCR-01–02 release
    needs: repair-pcr02
    if: ${{ always() && (needs.repair-pcr02.result == 'success' || needs.repair-pcr02.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install offdata-core validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Build executable requirement test view
        run: python scripts/build_test_registry.py
      - name: Build PCR-02 semantic test and referential-integrity records
        run: python scripts/build_pcr02_test_identity.py
      - name: Generate schemas, catalogues and OpenAPI
        run: python scripts/export_machine_contracts.py
      - name: Validate Phase 1 contract release
        run: python scripts/validate_phase1_contracts.py
      - name: Validate Phase 2 agent system
        run: python scripts/validate_phase2_agents.py
      - name: Build Phase 3 AI-audit analytical oracle
        run: python scripts/build_phase3_oracle.py
      - name: Validate Phase 3 AI-audit analytical oracle
        run: python scripts/validate_phase3_ai_audit_oracle.py
      - name: Build Phase 4 deliverable semantic model
        run: python scripts/build_phase4_deliverable_semantic_model.py
      - name: Validate Phase 4 deliverable semantic model
        run: python scripts/validate_phase4_deliverable_semantic_model.py
      - name: Build Phase 5 additional fixture programme
        run: python scripts/build_phase5_fixture_programme.py
      - name: Validate Phase 5 additional fixture programme
        run: python scripts/validate_phase5_fixture_programme.py
      - name: Build Phase 6 knowledge-ingestion intelligence
        run: python scripts/build_phase6_knowledge_intelligence.py
      - name: Validate Phase 6 knowledge-ingestion intelligence
        run: python scripts/validate_phase6_knowledge_intelligence.py
      - name: Build Phase 7 security and regionalisation
        run: python scripts/build_phase7_security_regionalisation.py
      - name: Rebuild PCR-02 after all governed source generation
        run: python scripts/build_pcr02_test_identity.py
      - name: Build PCR-01 canonical release reconciliation
        run: python scripts/build_pcr01_canonical_release.py
      - name: Enforce clean generated Phase 1–7 and PCR-01–02 records
        run: git diff --exit-code -- requirements/test-registry.json requirements/test-definitions.json requirements/referential-integrity-baseline.json fixtures/additional-primary-fixtures.json fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json knowledge/knowledge-ingestion-baseline.json security/security-regionalisation-baseline.json releases/canonical-chat-first-phase1-7-release.json
      - name: Validate Phase 7 security and regionalisation
        run: python scripts/validate_phase7_security_regionalisation.py
      - name: Validate PCR-01 canonical release reconciliation
        run: python scripts/validate_pcr01_canonical_release.py
      - name: Validate PCR-02 test identity and referential integrity
        run: python scripts/validate_pcr02_referential_integrity.py
      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce static lint baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce type-check baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Retain generated chat-first release
        uses: actions/upload-artifact@v4
        with:
          name: offdata-chat-first-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            api/openapi.json
            schemas/*.json
            contracts/*.json
            requirements/test-registry.json
            requirements/test-definitions.yaml
            requirements/test-definitions.json
            requirements/referential-integrity-baseline.json
            requirements/implemented-test-mappings*.json
            requirements/completed-planned-tests*.json
            configs/*.yaml
            agents/**/SKILL.md
            fixtures/additional-primary-fixture-seeds.yaml
            fixtures/additional-primary-fixtures.json
            fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json
            fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json
            knowledge/*.yaml
            knowledge/*.json
            security/README.md
            security/*.yaml
            security/*.json
            releases/*.json
            database/migrations/*.sql
