name: Machine contracts, agents, oracle, semantic deliverables and fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate chat-first Phases 1–5
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install offdata-core validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Build requirement test registry
        run: python scripts/build_test_registry.py
      - name: Generate schemas, catalogues and OpenAPI
        run: python scripts/export_machine_contracts.py
      - name: Validate Phase 1 contract release
        run: python scripts/validate_phase1_contracts.py
      - name: Validate Phase 2 agent system
        run: python scripts/validate_phase2_agents.py
      - name: Build Phase 3 AI-audit analytical oracle
        run: python scripts/build_phase3_oracle.py
      - name: Validate Phase 3 AI-audit analytical oracle
        run: python scripts/validate_phase3_ai_audit_oracle.py
      - name: Build Phase 4 deliverable semantic model
        run: python scripts/build_phase4_deliverable_semantic_model.py
      - name: Validate Phase 4 deliverable semantic model
        run: python scripts/validate_phase4_deliverable_semantic_model.py
      - name: Regenerate Phase 5 client-visible fixtures
        run: python scripts/generate_phase5_fixture_inputs.py
      - name: Build Phase 5 fixture evaluation baselines
        run: python scripts/build_phase5_fixture_suite.py
      - name: Enforce clean generated Phase 1–5 records
        run: >-
          git diff --exit-code --
          requirements/test-registry.json
          fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json
          fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json
          fixtures/corporate-strategy/FIXTURE-STRAT-001
          fixtures/cost-productivity/FIXTURE-COST-001
          fixtures/phase5-fixture-suite-baseline.json
      - name: Validate Phase 5 fixture suite
        run: python scripts/validate_phase5_fixture_suite.py
      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce static lint baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce type-check baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Retain generated chat-first release
        uses: actions/upload-artifact@v4
        with:
          name: offdata-chat-first-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            api/openapi.json
            schemas/*.json
            contracts/*.json
            requirements/test-registry.json
            requirements/implemented-test-mappings*.json
            requirements/completed-planned-tests*.json
            configs/*.yaml
            agents/**/SKILL.md
            fixtures/manifest.yaml
            fixtures/digital-ai/FIXTURE-DAI-001/oracle-baseline.json
            fixtures/digital-ai/FIXTURE-DAI-001/deliverable-semantic-baseline.json
            fixtures/corporate-strategy/FIXTURE-STRAT-001/**
            fixtures/cost-productivity/FIXTURE-COST-001/**
            fixtures/phase5-fixture-suite-baseline.json
            database/migrations/*.sql
