name: PCR-09 one-time materialization

on:
  push:
    branches:
      - governance/pcr09-first-codex-issue
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[pcr09-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - name: Materialize validated PCR-09 package
        run: python scripts/materialize_pcr09_payload.py
      - name: Commit materialized package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "PCR-09: materialize validated issue package [pcr09-materialized]"
          echo "MATERIALIZED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
