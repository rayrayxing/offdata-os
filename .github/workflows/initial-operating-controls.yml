name: Initial operating-control configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initial-operating-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-initial-operating-controls:
    name: Validate PCR-08 and retained PCR-04–07 boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Rebuild PCR-05 runtime adapter contracts
        run: python scripts/build_pcr05_runtime_adapters.py
      - name: Rebuild PCR-06 Hermes compatibility pack
        run: python scripts/build_pcr06_hermes_compatibility.py
      - name: Rebuild PCR-07 Northstar integration blueprint
        run: python scripts/build_pcr07_northstar_blueprint.py
      - name: Build PCR-08 initial operating controls
        run: python scripts/build_pcr08_initial_operating_controls.py
      - name: Rebuild PCR-04 Codex handoff
        run: python scripts/build_pcr04_codex_handoff.py
      - name: Enforce clean PCR-04–08 generated records
        run: git diff --exit-code -- contracts/runtime-adapter-contracts.json contracts/hermes-compatibility-pack.json contracts/northstar-integration-blueprint.json contracts/initial-operating-controls.json handoff/codex-phase0-handoff.json
      - name: Validate PCR-05 runtime adapters
        run: python scripts/validate_pcr05_runtime_adapters.py
      - name: Validate PCR-06 Hermes compatibility
        run: python scripts/validate_pcr06_hermes_compatibility.py
      - name: Validate PCR-07 Northstar integration blueprint
        run: python scripts/validate_pcr07_northstar_blueprint.py
      - name: Validate PCR-08 initial operating controls
        run: python scripts/validate_pcr08_initial_operating_controls.py
      - name: Validate PCR-04 Codex handoff
        run: python scripts/validate_pcr04_codex_handoff.py
      - name: Run deterministic test suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce static lint baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce type-check baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Retain PCR-08 operating-control evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-initial-operating-controls-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            configs/initial-operating-controls.yaml
            contracts/initial-operating-controls.json
            schemas/initial-operating-controls.schema.json
            scripts/build_pcr08_initial_operating_controls.py
            scripts/validate_pcr08_initial_operating_controls.py
            docs/47-PCR-08-INITIAL-OPERATING-CONTROL-CONFIGURATION.md
            reports/pcr08-validation-evidence.md
            configs/codex-handoff.yaml
            handoff/codex-phase0-handoff.json
            schemas/codex-handoff.schema.json
            scripts/build_pcr04_codex_handoff.py
            scripts/validate_pcr04_codex_handoff.py
            contracts/northstar-integration-blueprint.json
            contracts/hermes-compatibility-pack.json
            contracts/runtime-adapter-contracts.json
