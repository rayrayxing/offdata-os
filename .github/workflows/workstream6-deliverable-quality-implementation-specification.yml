name: Workstream 6 deliverable quality implementation specification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-deliverable-quality-implementation-specification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deliverable-quality-implementation-specification:
    name: Validate WS6.12 deliverable quality implementation specification and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
