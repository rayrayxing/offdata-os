name: Workstream 6 issue and backlog normalization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-issue-backlog-normalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-issue-backlog-normalization:
    name: Validate WS6.8 issue and backlog normalization and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
