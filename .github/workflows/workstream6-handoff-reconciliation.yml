name: Workstream 6 controlling machine handoff reconciliation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-handoff-reconciliation:
    name: Validate WS6.1 controlling machine handoff and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

