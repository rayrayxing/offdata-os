name: Codex Phase 0 launch control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream5-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-launch-control:
    name: Validate Codex Phase 0 launch control and complete prior release
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

# Historical job identity is retained as predecessor evidence.
# The reusable WS6.2 gate now performs deterministic generation, every prior
# validator, launch-verifier self-test, pytest --cov=offdata_core, Ruff and MyPy.
