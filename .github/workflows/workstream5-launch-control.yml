name: Codex Phase 0 launch control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream5-launch-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-launch-control:
    name: Validate Codex Phase 0 launch control and complete prior release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e 'packages/offdata-core[dev]'
      - name: Rebuild every governed record through Workstream 5
        run: |
          python scripts/build_test_registry.py
          python scripts/build_pcr02_test_identity.py
          python scripts/export_machine_contracts.py
          python scripts/build_phase3_oracle.py
          python scripts/build_phase4_deliverable_semantic_model.py
          python scripts/build_phase5_fixture_programme.py
          python scripts/build_phase6_knowledge_intelligence.py
          python scripts/build_phase7_security_regionalisation.py
          python scripts/build_pcr01_canonical_release.py
          python scripts/build_pcr03_repository_hygiene.py
          python scripts/build_pcr05_runtime_adapters.py
          python scripts/build_pcr06_hermes_compatibility.py
          python scripts/build_pcr07_northstar_blueprint.py
          python scripts/build_pcr08_initial_operating_controls.py
          python scripts/build_pcr09_codex_issue.py
          python scripts/build_pcr04_codex_handoff.py
          python scripts/build_pcr10_pre_codex_readiness.py
          python scripts/build_workstream4_readiness.py
          python scripts/build_workstream5_launch_control.py
      - name: Enforce clean deterministic generation
        run: git diff --exit-code
      - name: Validate every prior phase and Workstream 5
        run: |
          python scripts/validate_phase1_contracts.py
          python scripts/validate_phase2_agents.py
          python scripts/validate_phase3_ai_audit_oracle.py
          python scripts/validate_phase4_deliverable_semantic_model.py
          python scripts/validate_phase5_fixture_programme.py
          python scripts/validate_phase6_knowledge_intelligence.py
          python scripts/validate_phase7_security_regionalisation.py
          python scripts/validate_pcr01_canonical_release.py
          python scripts/validate_pcr02_referential_integrity.py
          python scripts/validate_pcr03_repository_hygiene.py
          python scripts/validate_pcr05_runtime_adapters.py
          python scripts/validate_pcr06_hermes_compatibility.py
          python scripts/validate_pcr07_northstar_blueprint.py
          python scripts/validate_pcr08_initial_operating_controls.py
          python scripts/validate_pcr09_codex_issue.py
          python scripts/validate_pcr04_codex_handoff.py
          python scripts/validate_pcr10_pre_codex_readiness.py
          python scripts/validate_workstream4_readiness.py
          python scripts/validate_workstream5_launch_control.py
          python scripts/prepare_codex_phase0_launch.py --self-test
      - name: Run deterministic runtime and coverage suite
        working-directory: packages/offdata-core
        run: pytest --cov=offdata_core --cov-report=term-missing --cov-fail-under=90 | tee /tmp/workstream5-pytest.log
      - name: Compile Python sources
        run: python -m compileall -q packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce Ruff baseline
        run: ruff check --config packages/offdata-core/pyproject.toml packages/offdata-core/src packages/offdata-core/tests scripts
      - name: Enforce strict MyPy baseline
        working-directory: packages/offdata-core
        run: mypy src
      - name: Verify canonical hosted issue states without inferring authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-evidence
          gh api "repos/${GITHUB_REPOSITORY}/issues/1" > ci-evidence/issue-1.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/2" > ci-evidence/issue-2.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/19" > ci-evidence/issue-19.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          issue1 = json.loads(Path('ci-evidence/issue-1.json').read_text())
          issue2 = json.loads(Path('ci-evidence/issue-2.json').read_text())
          issue19 = json.loads(Path('ci-evidence/issue-19.json').read_text())
          predecessor = Path('handoff/codex-phase0-issue-pcr10.md').read_text(encoding='utf-8')
          final = Path('handoff/codex-phase0-issue-workstream5.md').read_text(encoding='utf-8')
          live_digest = hashlib.sha256(issue1.get('body', '').encode()).hexdigest()
          allowed = {
              hashlib.sha256(predecessor.encode()).hexdigest(),
              hashlib.sha256(final.encode()).hexdigest(),
          }
          assert issue1['state'] == 'open'
          assert live_digest in allowed
          assert issue2['state'] == 'closed' and issue2.get('state_reason') == 'duplicate'
          assert issue19['state'] in {'open', 'closed'}
          if issue19['state'] == 'closed':
              assert issue19.get('state_reason') == 'completed'
          PY
      - name: Assemble retained evidence
        run: |
          cp /tmp/workstream5-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\n' "${{ github.event.pull_request.head.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-evidence/run.txt
          sha256sum \
            contracts/codex-phase0-launch-control.json \
            handoff/codex-phase0-issue-workstream5.md \
            releases/codex-phase0-launch-control-2026-08-06.json \
            schemas/codex-phase0-launch-control.schema.json \
            schemas/codex-phase0-launch-evidence.schema.json \
            schemas/codex-phase0-launch-permit.schema.json \
            > ci-evidence/repository-digests.txt
      - name: Retain Workstream 5 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-workstream5-launch-control-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            ci-evidence
            configs/codex-phase0-launch-control.yaml
            contracts/codex-phase0-launch-control.json
            schemas/codex-phase0-launch-control.schema.json
            schemas/codex-phase0-launch-evidence.schema.json
            schemas/codex-phase0-launch-permit.schema.json
            handoff/codex-phase0-issue-workstream5.md
            handoff/codex-phase0-hosted-controls-attestation.template.json
            handoff/codex-phase0-clean-macos-attestation.template.json
            handoff/codex-phase0-founder-authorization.template.json
            handoff/codex-phase0-launch-ack.template.json
            releases/codex-phase0-launch-control-2026-08-06.json
            scripts/build_workstream5_launch_control.py
            scripts/validate_workstream5_launch_control.py
            scripts/prepare_codex_phase0_launch.py
            scripts/codex_phase0_launch_core.py
            scripts/codex_phase0_launch_selftest.py
            docs/51-WORKSTREAM-5-CODEX-PHASE-0-LAUNCH-CONTROL.md
            reports/workstream5-launch-control-evidence.md
      - name: Publish exact-gate result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SUMMARY=$(grep -Eo '[0-9]+ passed in [0-9.]+s' /tmp/workstream5-pytest.log | tail -1)
          COVERAGE=$(grep 'Total coverage:' /tmp/workstream5-pytest.log | tail -1)
          gh pr comment "$PR_NUMBER" --body "Workstream 5 launch-control gate passed on head \`$HEAD_SHA\` and exact workflow ref \`$GITHUB_SHA\`. Run \`$GITHUB_RUN_ID\`. $TEST_SUMMARY. $COVERAGE. Complete Phase 1–7/PCR-01–10/Workstream 4–5 generation, validation, launch-verifier self-test, compilation, Ruff, strict MyPy and hosted issue-state checks passed. No launch permit was emitted and Codex remains unauthorized."
