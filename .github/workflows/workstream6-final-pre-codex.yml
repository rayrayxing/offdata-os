name: Final pre-Codex canonical handoff and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: final-pre-codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-pre-codex:
    name: Validate final pre-Codex canonical handoff and complete release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Run complete repository validation through WS6.16 preparation
        run: bash scripts/run_ws62_ci.sh

      - name: Verify exact WS6.16 preparation boundary
        id: release-boundary
        env:
          EXPECTED_HEAD: governance/ws616-permanent-release-record
          EXPECTED_BASE: governance/ws615-final-workflow
          EXPECTED_BASE_SHA: 161014fd8598977d05e0d8c1ac9723739e54dcca
          FINAL_RELEASE: releases/pre-codex-final-reconciliation-2026-08-06.json
        run: |
          python scripts/finalize_workstream6_permanent_release.py --self-test
          python scripts/require_workstream6_final_reconciliation.py --self-test
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prep = json.loads(Path('contracts/workstream6-permanent-release-record.json').read_text())
          assert prep['work_package_id'] == 'WS6.16'
          assert prep['completion']['release_machinery_prepared'] is True
          assert prep['completion']['permanent_release_record_complete'] is False
          assert prep['completion']['ws616_complete'] is False
          assert prep['boundaries']['codex_start_authorized'] is False

          event = os.environ.get('GITHUB_EVENT_NAME')
          payload = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          preparation_exception = False
          if event == 'pull_request':
              pr = payload['pull_request']
              preparation_exception = (
                  pr['head']['ref'] == os.environ['EXPECTED_HEAD']
                  and pr['base']['ref'] == os.environ['EXPECTED_BASE']
                  and pr['base']['sha'] == os.environ['EXPECTED_BASE_SHA']
              )

          release = Path(os.environ['FINAL_RELEASE'])
          if preparation_exception:
              assert not release.exists(), 'WS6.16 preparation PR must not fabricate the permanent release'
              print('WS6.16 exact preparation PR verified; permanent release intentionally absent; codex_start_authorized=false.')
          elif not release.exists():
              raise SystemExit('Permanent WS6.16 release is required outside the exact preparation PR; codex_start_authorized=false.')
          PY
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" \
            && "${{ github.event.pull_request.head.ref }}" == "$EXPECTED_HEAD" \
            && "${{ github.event.pull_request.base.ref }}" == "$EXPECTED_BASE" \
            && "${{ github.event.pull_request.base.sha }}" == "$EXPECTED_BASE_SHA" ]]; then
            echo "mode=ws616-preparation-exception" >> "$GITHUB_OUTPUT"
          else
            echo "mode=permanent-release-required" >> "$GITHUB_OUTPUT"
          fi

      - name: Require permanent WS6 release outside exact preparation PR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'governance/ws616-permanent-release-record' || github.event.pull_request.base.ref != 'governance/ws615-final-workflow' || github.event.pull_request.base.sha != '161014fd8598977d05e0d8c1ac9723739e54dcca'
        run: python scripts/require_workstream6_final_reconciliation.py

      - name: Assemble exact final-check evidence
        run: |
          mkdir -p ci-evidence/package
          cp /tmp/ws62-pytest.log ci-evidence/pytest.log
          printf 'head_sha=%s\nworkflow_sha=%s\nrun_id=%s\njob_name=%s\nmode=%s\n' \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "Validate final pre-Codex canonical handoff and complete release" \
            "${{ steps.release-boundary.outputs.mode }}" \
            > ci-evidence/run.txt
          : > ci-evidence/repository-digests.txt
          git ls-files -z | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$path" >> ci-evidence/repository-digests.txt
            destination="ci-evidence/package/$path"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
          done
          (cd ci-evidence/package && sha256sum -c ../repository-digests.txt)

      - name: Retain exact final-check evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offdata-final-pre-codex-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: ci-evidence

      - name: Record fail-closed final-check result
        run: |
          echo 'Final workflow repository validation passed.'
          echo 'A preparation-PR pass does not mean the permanent release exists.'
          echo 'The permanent release never replaces issue #19, clean macOS, Founder approval or launch-permit gates.'
          echo 'codex_start_authorized=false'
