name: Final pre-Codex canonical handoff and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: final-pre-codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-pre-codex:
    name: Validate final pre-Codex canonical handoff and complete release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact workflow reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/offdata-core/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/offdata-core[dev]'

      - name: Run complete repository validation through WS6.15
        run: bash scripts/run_ws62_ci.sh

      - name: Verify exact WS6.15 activation boundary
        env:
          EXPECTED_HEAD: governance/ws615-final-workflow
          EXPECTED_BASE: governance/ws614-cross-authority-consistency-gate
          EXPECTED_BASE_SHA: 272450f7aa4ac1c5c94c644bd9e1bbaa015685d1
          FINAL_RELEASE: releases/pre-codex-final-reconciliation-2026-08-06.json
        run: |
          python scripts/require_workstream6_final_reconciliation.py --self-test
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path('contracts/workstream6-final-workflow.json').read_text())
          assert contract['canonical_identity']['job_name'] == 'Validate final pre-Codex canonical handoff and complete release'
          assert contract['activation']['state'] == 'active_fail_closed_pending_permanent_release'
          assert contract['completion']['final_workflow_active'] is True
          assert contract['completion']['permanent_release_complete'] is False
          assert contract['completion']['manual_launch_gates_complete'] is False
          assert contract['boundaries']['codex_start_authorized'] is False

          event = os.environ.get('GITHUB_EVENT_NAME')
          event_path = Path(os.environ['GITHUB_EVENT_PATH'])
          payload = json.loads(event_path.read_text())
          activation_exception = False
          if event == 'pull_request':
              pr = payload['pull_request']
              activation_exception = (
                  pr['head']['ref'] == os.environ['EXPECTED_HEAD']
                  and pr['base']['ref'] == os.environ['EXPECTED_BASE']
                  and pr['base']['sha'] == os.environ['EXPECTED_BASE_SHA']
              )

          release = Path(os.environ['FINAL_RELEASE'])
          if activation_exception:
              assert not release.exists(), 'WS6.15 activation PR must not contain the WS6.16 permanent release'
              print('WS6.15 exact activation PR verified; permanent release intentionally absent; codex_start_authorized=false.')
          else:
              if not release.exists():
                  raise SystemExit('WS6.16 permanent final release is required for every non-activation final-workflow run; codex_start_authorized=false.')
          PY

      - name: Require permanent WS6 release outside exact activation PR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'governance/ws615-final-workflow' || github.event.pull_request.base.ref != 'governance/ws614-cross-authority-consistency-gate' || github.event.pull_request.base.sha != '272450f7aa4ac1c5c94c644bd9e1bbaa015685d1'
        run: python scripts/require_workstream6_final_reconciliation.py

      - name: Record fail-closed final-check result
        run: |
          echo 'Final workflow repository validation passed.'
          echo 'This check does not authorize Codex, merge, runtime activation, external actions, real client data or production deployment.'
          echo 'codex_start_authorized=false'
