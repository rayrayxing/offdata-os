name: Retain PCR-02 generated release

on:
  push:
    branches: [governance/pcr02-test-identity]

permissions:
  contents: write

jobs:
  retain:
    if: ${{ !contains(github.event.head_commit.message, '[pcr02-retained]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and expand governed source bundle
        shell: bash
        run: |
          cat .pcr02-staging/chunk-*.b64 > /tmp/pcr02.b64
          base64 --decode /tmp/pcr02.b64 > /tmp/pcr02.tar.gz
          echo "71440e8a3f2ce7c0dc8be4a181b52e22f2ad887ff62da7876a7339a9b3339df5  /tmp/pcr02.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/pcr02.tar.gz -C .
          python apply_pcr02_repairs.py
          rm apply_pcr02_repairs.py
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/offdata-core[dev]"
      - name: Generate all affected governed records
        run: |
          python scripts/build_test_registry.py
          python scripts/build_pcr02_test_identity.py
          python scripts/export_machine_contracts.py
          python scripts/build_phase3_oracle.py
          python scripts/build_phase4_deliverable_semantic_model.py
          python scripts/build_phase5_fixture_programme.py
          python scripts/build_phase6_knowledge_intelligence.py
          python scripts/build_phase7_security_regionalisation.py
          python scripts/build_pcr02_test_identity.py
          python scripts/build_pcr01_canonical_release.py
      - name: Retain governed release and remove staging path
        shell: bash
        run: |
          rm -rf .pcr02-staging
          git rm .github/workflows/pcr02-retain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PCR-02 test identity and referential integrity [pcr02-retained]"
          git push origin HEAD:governance/pcr02-test-identity
