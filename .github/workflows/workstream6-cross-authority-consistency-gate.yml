name: Workstream 6 cross-authority consistency gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream6-cross-authority-consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cross-authority-consistency:
    name: Validate WS6.14 cross-authority consistency gate and complete prior components
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
