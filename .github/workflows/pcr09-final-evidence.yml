name: PCR-09 final issue and release evidence

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

  retained-pin-inventory:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-pcr09-pin-inventory
          path: .

# Historical workflow identity and exact Node 24 action-pin inventory are retained.
# The reusable WS6.2 gate accepts only the final canonical issue body and runs all
# prior builders, validators, runtime tests, compilation, Ruff and strict MyPy.
