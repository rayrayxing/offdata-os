name: Hosted controls, evidence and environment readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: workstream4-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workstream 4 repository readiness
    uses: ./.github/workflows/workstream6-final-launch-control.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write

  retained-pin-inventory:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-workstream4-pin-inventory
          path: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

# Historical workflow identity and the exact Workstream 4 action-pin sequence are
# retained for the immutable readiness contract. Branch cleanup remains a manual
# issue #19 gate; the reusable WS6.2 workflow performs all repository validation.
